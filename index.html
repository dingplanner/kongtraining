<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Security: the app never talks to a server. Block every outgoing connection and outside script, so saved data can't be sent anywhere.
     Only the app's own files (manifest, icons, offline worker) may load. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kong Training</title>
<meta name="theme-color" content="#0a0a0b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Kong">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* KONG TRAINING — design system
   Near-black surfaces, one accent (volt), the phone's own sans-serif in sentence case.
   Big type is kept for numbers; everything else is calm. Phases are shown by a small
   coloured label and the timer ring, never by repainting the whole screen. */
:root{
  --bg:#0a0a0b; --surface:#141416; --surface-2:#1e1e21; --surface-3:#2a2a2e; --line:rgba(255,255,255,.07);
  --ink:#f4f4f5; --muted:#8e8e95; --faint:#5c5c63;
  --accent:#d6ff3e; --accent-ink:#0a0a0b; --accent-soft:rgba(214,255,62,.12);
  --warm:#ffb547; --cool:#7cc4ff; --run:#5fd7a6; --danger:#ff7a6b;
  --phase:var(--accent);
  --fig-hi:#fbfbfc; --fig-mid:#c7c7cd; --fig-lo:#6e6e77; --far-hi:#7a7a82; --far-mid:#55555c; --far-lo:#2f2f35;
  --metal-hi:#6a6a72; --metal-lo:#2b2b30; --prop:#2a2a2f; --prop-hi:#3d3d44; --floor:rgba(255,255,255,.12); --shadow:rgba(0,0,0,.55);
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --gx:max(16px,env(safe-area-inset-left,0px)); --gxr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
:root[data-phase="warm"]{--phase:var(--warm)}
:root[data-phase="cool"]{--phase:var(--cool)}
:root[data-phase="run"]{--phase:var(--run)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:var(--gx);padding-right:var(--gxr);padding-block:12px 180px}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
h1,h2{font-family:var(--display);font-weight:700;letter-spacing:-.035em;line-height:1.04}
h1{font-size:2.125rem}
h2{font-size:1.75rem}
h3{font-size:1.0625rem;font-weight:600;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow,.kicker,.phase,.grp{font-size:.6875rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.num-l{font-variant-numeric:tabular-nums;letter-spacing:-.04em}

/* masthead */
.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:4px}
.wordmark{display:flex;flex-direction:column;gap:6px;min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-size:.75rem;font-weight:800;letter-spacing:.24em;color:var(--ink)}
.brand i{width:8px;height:8px;border-radius:2px;background:var(--accent);display:block}
.wordmark h1{font-size:clamp(1.5rem,7.4vw,2.125rem);white-space:nowrap}
.wordmark span{font-size:.875rem;color:var(--muted)}
.goal{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:right;color:var(--ink)}
.goal svg{width:52px;height:52px;transform:rotate(-90deg);flex:none}
.goal .gtxt{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.goal .gtxt b{font-weight:700;font-size:1.375rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.goal .gtxt b small{font-size:.75em;color:var(--muted);font-weight:600}
.goal .gtxt span{font-size:.75rem;color:var(--muted);white-space:nowrap}
.goal .gtxt .streak{color:var(--accent);font-weight:600}
.goalset{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 12px 12px 16px}
.goalset .stepper{padding:4px}
.goalset .stepper button{width:44px;height:44px}
.goalset .stepper output{font-size:1.5rem;min-width:40px}

/* week strip: date circles, a dot under days you trained */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.6875rem;font-weight:600;letter-spacing:.06em;color:var(--faint);min-width:0;position:relative;padding-bottom:10px}
.wd i{width:38px;height:38px;max-width:100%;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:600;font-size:.9375rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wd.on::after{content:"";position:absolute;bottom:0;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.wd.on i{color:var(--ink)}
.wd.today i{background:var(--ink);color:var(--bg)}
.wd.today span{color:var(--ink)}
.wd i.sm{font-size:.9375rem}

/* workout chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * var(--gx)) calc(-1 * var(--gxr));padding:2px var(--gxr) 2px var(--gx);scroll-padding-inline:var(--gx)}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);border-radius:99px;min-height:40px;padding:0 16px;background:var(--surface);color:var(--muted);font-weight:600;font-size:.875rem;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips .div{flex:none;width:1px;background:var(--line);margin:8px 2px}

/* hero card: today's workout */
.poster{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:24px;overflow:hidden;position:relative}
.poster canvas{display:block;width:100%;height:200px}
.poster .stage{background:radial-gradient(70% 90% at 50% 70%,var(--accent-soft) 0%,rgba(214,255,62,0) 70%),linear-gradient(180deg,#19191c,#121214)}
.poster-txt{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.poster h2{font-size:1.875rem}
.poster .kicker{color:var(--accent)}
.metarow{display:grid;grid-template-columns:auto auto minmax(0,1fr);margin-top:6px}
.metarow div{display:flex;flex-direction:column;gap:2px;padding:0 12px;border-left:1px solid var(--line);min-width:0}
.metarow div:first-child{padding-left:0;border-left:0}
@media (max-width:360px){.metarow b{font-size:.9375rem}.metarow div{padding:0 8px}}
.metarow b{font-size:1.125rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metarow span{font-size:.75rem;color:var(--muted)}

/* cards */
.runbox,.weigh{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.runtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.runtop h2,.runtop h3{font-size:1.25rem;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.runbox .meta{font-size:.9375rem;color:var(--muted)}
.runbox .kicker{color:var(--run)}
.runbtns{display:flex;gap:8px}
.runbtns .btn{flex:1 1 0;min-height:48px;padding:12px 14px;font-size:.9375rem}
.wkctl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.8125rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.wkctl button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:1rem;line-height:1;color:var(--ink)}
.wkctl button:disabled{opacity:.3;cursor:default}
.runlist{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.runlist div{background:var(--surface-2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.runlist div.today{box-shadow:inset 0 0 0 1.5px var(--run)}
.rd{font-size:.6875rem;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.rm{font-weight:700;font-size:1.125rem;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rm small{color:var(--muted);font-weight:600}
.rt{font-size:.75rem;line-height:1.2;color:var(--muted);overflow-wrap:anywhere}
.tick{font-style:normal;color:var(--run)}

/* lists */
.section{display:flex;flex-direction:column}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:10px}
.grp{padding:16px 0 6px}
.row{display:flex;align-items:center;gap:14px;padding:8px 0;border-top:1px solid var(--line)}
.grp + .row{border-top:0}
.row canvas{width:64px;height:48px;border-radius:12px;background:var(--surface);border:1px solid var(--line);flex:none}
.row div{display:flex;flex-direction:column;min-width:0}
.row b{font-weight:600;font-size:.9375rem}
.row span{font-size:.8125rem;color:var(--muted);font-variant-numeric:tabular-nums}
details.grpd{border-radius:16px;background:var(--surface);border:1px solid var(--line);margin:6px 0}
details.grpd summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;min-height:52px}
details.grpd summary::-webkit-details-marker{display:none}
details.grpd summary b{font-weight:600;font-size:.9375rem}
details.grpd summary span{font-size:.8125rem;color:var(--muted);margin-left:auto}
details.grpd summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin:-4px 2px 0 0;transition:transform .2s}
details.grpd[open] summary::after{transform:rotate(-135deg);margin-top:4px}
details.grpd .inner{padding:0 16px 6px}
details.grpd .row canvas{background:var(--surface-2)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:2px 16px}
.list > div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.list > div:first-child{border-top:0}
.list span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.hl{display:flex;align-items:center;gap:12px;min-width:0}
.list .hl span{color:var(--ink);text-align:left}
.list .hl span .muted{color:var(--muted)}
.badge-l{flex:none;width:34px;height:34px;border-radius:10px;background:var(--surface-2);color:var(--accent);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:.8125rem;letter-spacing:-.01em}
.badge-l.q{color:var(--warm)}
.badge-l.r{color:var(--run)}
.badge-l.g{color:var(--ink)}
.morebtn{background:none;border:0;color:var(--accent);font-weight:600;padding:12px 0;cursor:pointer;align-self:flex-start;font-size:.9375rem}

/* stage (animated figure) */
.stage{background:radial-gradient(80% 90% at 50% 70%,rgba(255,255,255,.06) 0%,rgba(255,255,255,0) 70%);position:relative}
.stage canvas{display:block;width:100%;height:100%}

/* player */
.bars{display:flex;gap:3px}
.bars i{flex:1;height:3px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:var(--phase)}
.bars i.done b{width:100%}
.bars i.now b{opacity:.6}
.playtop{display:flex;justify-content:space-between;align-items:center;margin-top:-6px}
.close{width:40px;height:40px;border-radius:50%;background:var(--surface-2);border:0;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.phase{display:flex;align-items:center;gap:8px;color:var(--ink)}
.phase::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--phase)}
.player-stage{margin-left:calc(-1 * var(--gx));margin-right:calc(-1 * var(--gxr));height:min(32vh,260px);margin-top:-8px;
  background:radial-gradient(60% 80% at 50% 75%,color-mix(in srgb,var(--phase) 14%,transparent) 0%,transparent 70%)}
.player-stage a{position:absolute;right:var(--gxr);bottom:10px;font-size:.75rem;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);padding:6px 12px;border-radius:99px;text-decoration:none;font-weight:600;backdrop-filter:blur(8px)}
.title{display:flex;flex-direction:column;gap:4px}
.title h2{font-size:1.875rem}
.target{font-size:.9375rem;font-weight:600;color:var(--phase)}
.cue{color:var(--muted);max-width:60ch;font-size:.9375rem}
.metric{display:flex;align-items:center;justify-content:space-between;gap:16px}
.ringwrap{position:relative;width:156px;height:156px;flex:none}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .num{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:2px}
.big{font-family:var(--display);font-weight:700;font-size:3.25rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.045em}
.big.long{font-size:2.6rem}
.huge{font-family:var(--display);font-weight:700;font-size:3.5rem;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.05em}
.unit{font-family:var(--sans);font-size:.8125rem;color:var(--muted);font-weight:500;letter-spacing:0}
.setcol{display:flex;flex-direction:column;gap:6px}
.stepper{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px}
.stepper button{width:48px;height:48px;border-radius:13px;border:0;background:var(--surface-2);font-size:1.375rem;font-weight:500;cursor:pointer;color:var(--ink)}
.stepper output{min-width:56px;text-align:center;font-weight:700;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.steplbl{font-size:.75rem;color:var(--muted);text-align:center;margin-top:6px}
.side{display:flex;flex-direction:column;gap:8px;align-items:flex-end;text-align:right;min-width:0}
.dots{display:flex;gap:6px;margin-top:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--surface-3)}
.dots i.on{background:var(--phase)}
.lastline{font-size:.8125rem;color:var(--muted);text-align:center;margin-top:6px}
.lastline b{color:var(--ink);font-weight:600}
.radj{display:flex;gap:8px}
.radj button{min-width:64px;min-height:44px;border-radius:13px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-weight:600;font-size:.875rem;cursor:pointer;font-variant-numeric:tabular-nums}

/* gym / home switch */
.where{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-top:-8px}
.where button{border:0;background:none;border-radius:10px;min-height:40px;font-weight:600;font-size:.875rem;color:var(--muted);cursor:pointer}
.where button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink)}
/* daily habits */
.habits{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.habits .kicker{color:var(--accent)}
.hlist{display:flex;flex-direction:column;gap:6px}
.hb{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface-2);border:0;border-radius:14px;padding:10px 12px;min-height:52px;cursor:pointer;color:var(--ink)}
.hb i{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--surface-3);display:grid;place-items:center}
.hb.on i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hb span{display:flex;flex-direction:column;gap:1px;min-width:0}
.hb b{font-weight:600;font-size:.9375rem}
.hb small{font-size:.75rem;color:var(--muted)}
.hb.on b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
/* coach's notes */
details.guide .inner{display:flex;flex-direction:column;gap:10px;padding-bottom:14px;color:var(--muted);font-size:.9375rem}
details.guide .inner b{color:var(--ink);font-weight:600}
/* set table (Set / Previous / Reps) */
.sets{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.sets .sh,.sets .sr{display:grid;grid-template-columns:44px 1fr 1fr 36px;align-items:center;gap:8px;padding:0 14px}
.sets .sh{height:34px;font-size:.6875rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.sets .sr{min-height:46px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:.9375rem}
.sets .sr .n{font-weight:700;color:var(--muted)}
.sets .sr .pv{color:var(--muted)}
.sets .sr .rp{font-weight:600}
.sets .sr .ck{width:26px;height:26px;border-radius:8px;background:var(--surface-3);display:grid;place-items:center;justify-self:end}
.sets .sr.done .ck{background:var(--phase);color:var(--accent-ink)}
.sets .sr.done .rp{color:var(--ink)}
.sets .sr.now{background:var(--surface-2)}
.sets .sr.now .n{color:var(--phase)}
.sets .sr.now .ck{box-shadow:inset 0 0 0 1.5px var(--phase);background:none}
.sets .sr.next .rp{color:var(--faint)}
.sets .sh,.sets .sr{grid-template-columns:36px 1fr 136px 28px}
.sets .sr.now{min-height:60px}
.mini{display:flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:3px}
.mini button{width:40px;height:40px;border-radius:11px;border:0;background:var(--surface-3);color:var(--ink);font-size:1.25rem;cursor:pointer}
.wtc{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 16px}
.wtc .lbl{display:flex;flex-direction:column;gap:1px}
.wtc .lbl b{font-weight:600}
.wtc .lbl span{font-size:.75rem;color:var(--muted)}
.wtc .mini{width:160px}
.mini input{flex:1;min-width:0;width:100%;text-align:center;background:none;border:0;color:var(--ink);font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums;letter-spacing:-.03em;padding:0;-moz-appearance:textfield}
.mini input::-webkit-outer-spin-button,.mini input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mini output{flex:1;text-align:center;font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
:root.tbl .player-stage{height:min(26vh,210px)}

/* end-workout sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:0 var(--gxr) calc(16px + env(safe-area-inset-bottom,0px)) var(--gx);animation:fade .18s ease}
.sheet{width:100%;max-width:480px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:24px;padding:22px 18px 16px;display:flex;flex-direction:column;gap:10px;animation:rise .22s cubic-bezier(.2,.8,.2,1)}
.sheet h3{font-family:var(--display);font-weight:700;font-size:1.375rem;letter-spacing:-.025em}
.sheet p{color:var(--muted);font-size:.9375rem;margin-bottom:6px}
.sheet .btn{width:100%}
.sheet .btn.danger{background:none;color:var(--danger);min-height:48px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px);opacity:0}}

/* dock + buttons */
.dock{position:fixed;left:0;right:0;bottom:0;padding-top:28px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:var(--gx);padding-right:var(--gxr);background:linear-gradient(to bottom,rgba(10,10,11,0),var(--bg) 26px);z-index:5}
.dock-in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.dock-row{display:flex;gap:10px}
.dock-row > *{flex:1 1 0;min-width:0}
.btn{border:0;border-radius:16px;padding:16px 18px;font-weight:600;font-size:1rem;cursor:pointer;background:var(--surface-2);color:var(--ink);min-height:56px;letter-spacing:-.01em}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.0625rem}
.btn.light{background:var(--ink);color:var(--bg)}
.minor{display:flex;justify-content:space-between;align-items:center;gap:8px}
.minor button{background:none;border:0;cursor:pointer;color:var(--muted);font-size:.875rem;font-weight:600;padding:0 10px;min-height:44px;min-width:64px;margin:0 -10px}
.minor button:disabled{opacity:.3;cursor:default}
.minor span{font-size:.8125rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.minor span b{color:var(--ink);font-weight:600}

/* weight */
.pill{font-size:.75rem;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.pill.good{color:var(--run)}
.pill.warn{color:var(--warm)}
.pill.up{color:var(--danger)}
.wnow{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.huge-w{font-family:var(--display);font-weight:700;font-size:2.75rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.045em}
.wdelta{flex-basis:100%;font-weight:500;font-size:.875rem;color:var(--muted)}
.wdelta.down{color:var(--run)}
.wdelta.upc{color:var(--danger)}
.wchart{display:block;width:100%;height:auto;max-width:100%}
.wprot{display:flex;flex-direction:column;gap:2px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:14px;padding:10px 14px;font-size:.9375rem;color:var(--ink)}
.wprot b{color:var(--accent);font-weight:700;font-size:1.0625rem;font-variant-numeric:tabular-nums}
.wprot em{font-style:normal}
.wprot span{font-size:.8125rem;color:var(--muted)}
.wchart text{fill:var(--faint);font-size:10px;font-family:var(--sans);font-variant-numeric:tabular-nums}
.wform{display:flex;flex-direction:column;gap:8px}
.wrow{display:flex;align-items:baseline;gap:8px}
.wrow input{width:150px;font-family:var(--display);font-weight:700;font-size:2rem;line-height:1;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.wrow input:focus{border-color:var(--accent);outline:none}
.err{color:var(--danger);font-weight:600;font-size:.875rem}
.wlist{background:var(--surface-2);border:0}
.wlist b{color:var(--ink);font-weight:600}
.x{background:none;border:0;color:var(--muted);font-size:1.1rem;line-height:1;cursor:pointer;padding:6px 8px;margin-left:2px;min-width:32px;min-height:32px}

/* gym weight row */
.wt{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.wthead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.lastchip{font-size:.8125rem;color:var(--muted)}
.lastchip b{color:var(--ink);font-weight:600}
.wtrow{display:flex;align-items:center;gap:10px}
.wt .stepper{background:var(--surface-2);border:0}
.wt .stepper button{background:var(--surface-3)}
.stepper input{width:92px;min-width:0;text-align:center;background:none;border:0;color:var(--ink);font-weight:700;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums;padding:0;letter-spacing:-.04em;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tip{color:var(--accent);font-weight:600}

/* finish */
.done-hero{display:flex;flex-direction:column;gap:10px;padding-top:24px}
.done-mark{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-bottom:6px}
.done-hero h1{font-size:2.25rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat b{font-family:var(--display);font-size:1.75rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.045em}
.stat span{font-size:.75rem;color:var(--muted)}
.pb{display:inline-block;font-style:normal;font-size:.625rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);padding:2px 6px;border-radius:6px;margin-left:8px;vertical-align:2px}
.goalline{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.goalline svg{width:44px;height:44px;transform:rotate(-90deg);flex:none}
.goalline b{font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<div class="wrap" id="app"></div>

<script>
/* ================= Animated demo figures =================
   Side view. Floor at y=180, logical canvas 300 x 215 (shifted down 25 so a bar fits at y=-7).
   Pose points: h head, s shoulder, p hip, e/w near elbow/hand, k/f near knee/foot; e2,w2,k2,f2 = far limbs. */
const ANIM_BY_NAME = {
  "Dumbbell bench press":"benchPress","Incline dumbbell press":"inclinePress","Dumbbell floor press":"floorPress","Lat pulldown":"latPulldown",
  "Seated cable row":"cableRow","Couch hip thrust":"hipThrust","Hip thrust":"hipThrust","Face pull":"facePull","Assisted pull-up":"pullup",
  "Feet-elevated push-ups":"pushup","Overhead dumbbell extension":"overheadExtDB","Dumbbell curl":"curl","Romanian deadlift":"rdl",
  "Dumbbell split squat":"lunge","Single-leg Romanian deadlift":"rdl",
  "Arm circles":"armCircles","Leg swings":"legSwing","Bodyweight squats":"squat","Lunge with twist":"lunge","Dead hang":"deadHang",
  "Push-ups":"pushup","Goblet squat":"goblet","Dumbbell shoulder press":"press","Bulgarian split squat":"bulgarian",
  "Diamond push-ups":"pushup","Burpees":"burpee","Pull-ups":"pullup","One-arm dumbbell row":"row","Chin-ups":"pullup",
  "Dumbbell Romanian deadlift":"rdl","Hanging knee raises":"kneeRaise","Plank":"plank","Dumbbell lateral raise":"lateral","Mountain climbers":"climber","Quick circuit":"circuit","Rest":"rest","Incline walk":"walk","Leg press":"legPress","Barbell Romanian deadlift":"rdl","Walking lunges":"lungeWalk","Leg extension":"legExt","Leg curl":"legCurl","Standing calf raise":"calf","Cable crunch":"cableCrunch","Seated dumbbell shoulder press":"press","Assisted dip":"dip","EZ-bar curl":"curl","Rope pushdown":"pushdown","Cable lateral raise":"lateral","Incline dumbbell curl":"curl","Overhead cable extension":"overheadExt","Hammer curl":"curl","Easy jog":"run","Easy run":"run","Long easy run":"run","Warm-up jog":"run","Cool-down jog":"run","Comfortably hard":"run","Fast stride":"sprint","Walk":"walk",
  "Doorway chest stretch":"chest","Lat stretch":"lat","Hamstring stretch":"hamstring","Hip flexor stretch":"hipFlexor",
  "Standing quad stretch":"quad","Child's pose":"child",
};

/* ===================== FIGURE: skeleton, motion, rendering =====================
   Poses are authored as joint positions (side view, figure faces +x unless a.face=-1, floor y=183).
   They are only "intent": every frame is rebuilt on one fixed skeleton, so bones never stretch.
   - Pelvis position, spine and head angles are interpolated.
   - A hand or foot that stays put between two keys is planted: knee/elbow solved by IK so it
     stays exactly on the floor, bar or bench. Free limbs rotate at their joints (FK).
   - Timing: a short pause at each end of a rep, eased in and out. */
const LIMBS = ["h","s","p","e","w","k","f","e2","w2","k2","f2"];
const BONE = {spine:50, neck:16, thigh:41, shin:40, upper:26, fore:24}, FLOOR=177;
const LIMB_DEF = [ // [mid, end, root, upperLen, lowerLen, default bend (+1 knee forward, -1 elbow back)]
  ["k","f","p","thigh","shin", 1], ["k2","f2","p","thigh","shin", 1],
  ["e","w","s","upper","fore",-1], ["e2","w2","s","upper","fore",-1]];
function fill(p){ const q={...p};
  for(const [far,near] of [["e2","e"],["w2","w"],["k2","k"],["f2","f"]]) if(!q[far]) q[far]=[q[near][0]-4,q[near][1]];
  return q; }
const ang=(a,b)=>Math.atan2(b[1]-a[1],b[0]-a[0]);
const dirv=t=>[Math.cos(t),Math.sin(t)];
const add2=(a,v,l)=>[a[0]+v[0]*l,a[1]+v[1]*l];
const lerp2=(a,b,v)=>[a[0]+(b[0]-a[0])*v,a[1]+(b[1]-a[1])*v];
const lerpA=(a,b,v)=>{ let d=((b-a+Math.PI*3)%(Math.PI*2))-Math.PI; return a+d*v; };
const dist=(a,b)=>Math.hypot(b[0]-a[0],b[1]-a[1]);
const cross=(r,m,t)=>(m[0]-r[0])*(t[1]-r[1])-(m[1]-r[1])*(t[0]-r[0]);
/* 2-bone IK: elbow/knee position for root->target with fixed lengths, bending to side sg. */
function ik(r,t,L1,L2,sg){
  const d=Math.min(L1+L2-0.01,Math.max(Math.abs(L1-L2)+0.01,dist(r,t))), phi=ang(r,t);
  const al=Math.acos(Math.max(-1,Math.min(1,(L1*L1+d*d-L2*L2)/(2*L1*d))));
  const tt=add2(r,dirv(phi),d);
  let m=add2(r,dirv(phi+al),L1); const m2=add2(r,dirv(phi-al),L1);
  if(sg==="up"){ if(m2[1]<m[1]) m=m2; } else if(Math.sign(cross(r,m,tt))!==sg) m=m2;
  return [m,add2(m,dirv(ang(m,tt)),L2)];
}
/* Key -> skeleton description (angles + targets). Cached per key object. */
const KEYC=new WeakMap();
function prep(k0){
  if(KEYC.has(k0)) return KEYC.get(k0);
  const k=fill(k0), o={p:k.p, sp:ang(k.p,k.s), hd:ang(k.s,k.h), ft:k.ft||[0,0], L:{}};
  for(const [m,e,r] of LIMB_DEF){ const bend=cross(k[r],k[m],k[e])/((dist(k[r],k[m])*dist(k[r],k[e]))||1);   // sine of the bend angle
    o.L[e]={up:ang(k[r],k[m]), lo:ang(k[m],k[e]), end:k[e], bend, hi:!!(k.hi&&k.hi.includes(e))}; }
  KEYC.set(k0,o); return o;
}
function build(A,B,v,face,slide){
  const P=lerp2(A.p,B.p,v), sp=lerpA(A.sp,B.sp,v), hd=lerpA(A.hd,B.hd,v);
  const s=add2(P,dirv(sp),BONE.spine), h=add2(s,dirv(hd),BONE.neck), out={p:P,s,h,ft:[A.ft[0]+(B.ft[0]-A.ft[0])*v, A.ft[1]+(B.ft[1]-A.ft[1])*v]};
  for(const [m,e,r,u,l,def] of LIMB_DEF){
    const a=A.L[e], b=B.L[e], root=r==="p"?P:s, planted=dist(a.end,b.end)<4 || (slide&&slide.includes(e));
    if(planted){ const bb=Math.abs(a.bend)>=Math.abs(b.bend)?a.bend:b.bend, sg=a.hi&&b.hi?"up":Math.abs(bb)>.12?Math.sign(bb):def*face;
      [out[m],out[e]]=ik(root,lerp2(a.end,b.end,v),BONE[u],BONE[l],sg); }
    else { out[m]=add2(root,dirv(lerpA(a.up,b.up,v)),BONE[u]); out[e]=add2(out[m],dirv(lerpA(a.lo,b.lo,v)),BONE[l]);
      // the floor is solid: a swinging hand or foot that would dip below it slides along it instead
      if(out[e][1]>FLOOR){ const bb=Math.abs(a.bend)>=Math.abs(b.bend)?a.bend:b.bend; [out[m],out[e]]=ik(root,[out[e][0],FLOOR],BONE[u],BONE[l],Math.abs(bb)>.12?Math.sign(bb):def*face); } }
  }
  return out;
}
const easeIO = u => u<.5 ? 4*u*u*u : 1-Math.pow(-2*u+2,3)/2;
function poseAt(a, T){
  const face=a.face||1;
  if(a.fn){ const K=prep(a.fn((T % a.ms)/a.ms)); KEYC.delete(K); return build(K,K,0,face); }
  const n=a.keys.length, seg=Math.floor(T/a.ms)%n, u=(T%a.ms)/a.ms, hold=a.hold??.16;
  const v=easeIO(Math.min(1,Math.max(0,(u-hold)/(1-2*hold))));
  return build(prep(a.keys[seg]),prep(a.keys[(seg+1)%n]),v,face,a.slide);
}

/* ---------- rendering ---------- */
let demoName=null, demoT0=0;
function getCol(cv){ const cs=getComputedStyle(cv), g=k=>cs.getPropertyValue(k).trim();
  return {hi:g("--fig-hi"), mid:g("--fig-mid"), lo:g("--fig-lo"), farHi:g("--far-hi"), farMid:g("--far-mid"), farLo:g("--far-lo"),
    metalHi:g("--metal-hi"), metalLo:g("--metal-lo"), prop:g("--prop"), propHi:g("--prop-hi"), floor:g("--floor"), shadow:g("--shadow")}; }
function sizeCanvas(cv){
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight;
  if(!W||!H) return false;
  if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);}
  return true;
}
const LIGHT=[-0.42,-0.91];
/* Samples a limb chain into points with widths from a profile. prof(t) gives width, t in 0..1 along the whole chain. */
function chain(pts, prof, per){
  const segs=pts.length-1, out=[];
  for(let i=0;i<segs;i++) for(let j=0;j<per;j++){ const v=j/per; out.push({x:pts[i][0]+(pts[i+1][0]-pts[i][0])*v, y:pts[i][1]+(pts[i+1][1]-pts[i][1])*v, t:(i+v)/segs}); }
  out.push({x:pts[segs][0], y:pts[segs][1], t:1});
  out.forEach((q,i)=>{ const a=out[Math.max(0,i-1)], b=out[Math.min(out.length-1,i+1)], L=Math.hypot(b.x-a.x,b.y-a.y)||1;
    q.tx=(b.x-a.x)/L; q.ty=(b.y-a.y)/L; q.nx=-q.ty; q.ny=q.tx; q.w=prof(q.t); });
  return out;
}
function outline(c, q){   // smooth closed outline with round caps
  const L=q.map(p=>[p.x+p.nx*p.w/2,p.y+p.ny*p.w/2]), R=q.map(p=>[p.x-p.nx*p.w/2,p.y-p.ny*p.w/2]).reverse();
  const ring=[...L,...R]; c.beginPath(); c.moveTo((ring[0][0]+ring[1][0])/2,(ring[0][1]+ring[1][1])/2);
  for(let i=1;i<ring.length;i++){ const a=ring[i], b=ring[(i+1)%ring.length]; c.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2); }
  c.closePath();
  // caps and joints must wind the same way as the outline, or "nonzero" filling punches holes
  let area=0; for(let i=0;i<ring.length;i++){ const a=ring[i], b=ring[(i+1)%ring.length]; area+=a[0]*b[1]-b[0]*a[1]; }
  q.ccw = area<0;
  const e=q[q.length-1], s0=q[0]; circ(c,e.x,e.y,e.w/2,q.ccw); circ(c,s0.x,s0.y,s0.w/2,q.ccw);
}
function circ(c,x,y,r,ccw){ c.moveTo(x+r,y); c.arc(x,y,r,0,Math.PI*2,ccw); }
function joints(c,q,idx){ idx.forEach(i=>{ const p=q[i]; circ(c,p.x,p.y,p.w/2,q.ccw); }); }
/* Cylinder shading: base tone, then a soft highlight on the lit side and a core shadow on the far side. */
function shadeBody(c,q,tone,extra){
  c.save(); c.fillStyle=tone[1]; outline(c,q); if(extra) extra(); c.fill("nonzero"); c.clip("nonzero");
  // one continuous ribbon per band (no per-segment overlaps), feathered by stacking narrower copies
  const ribbon=(k,wk)=>{ const Lp=[], Rp=[];
    q.forEach(p=>{ const sl=Math.max(-1,Math.min(1,(p.nx*LIGHT[0]+p.ny*LIGHT[1])*3)), cx=p.x+p.nx*sl*p.w*k, cy=p.y+p.ny*sl*p.w*k, hw=p.w*wk/2;
      Lp.push([cx+p.nx*hw,cy+p.ny*hw]); Rp.push([cx-p.nx*hw,cy-p.ny*hw]); });
    const ring=[...Lp,...Rp.reverse()]; c.beginPath(); c.moveTo(...ring[0]); ring.forEach(pt=>c.lineTo(...pt)); c.closePath(); c.fill(); };
  const band=(k,wk,col,al)=>{ c.fillStyle=col; for(const f of [1,.66,.36]){ c.globalAlpha=al/3; ribbon(k,wk*f); } };
  band(-.36,.62,tone[2],.9);   // core shadow (away from light)
  band(.2,.56,tone[0],.85);    // broad highlight
  band(.24,.2,tone[0],.6);     // tight highlight
  c.restore();
}
const PROF = {
  leg: t=> t<.5 ? (t<.08?14.5:14.5-(t-.08)/.42*4.3) : (()=>{const u=(t-.5)/.5; return u<.28?10.2+u/.28*1.3:11.5-(u-.28)/.72*5.2;})(),
  arm: t=> t<.5 ? (t<.15?10.6-t*4:t<.38?10:10-(t-.38)/.12*2.2) : (()=>{const u=(t-.5)/.5; return u<.22?7.8+u/.22*.9:8.7-(u-.22)/.78*3.1;})(),
};
function drawLimb(c,root,mid,end,kind,tone){ const q=chain([root,mid,end],PROF[kind],7); shadeBody(c,q,tone,()=>joints(c,q,[7])); return q; }
function drawFoot(c,ankle,knee,face,tone,pitch){
  const sd=dirv(ang(knee,ankle)), f0=face>0?[sd[1],-sd[0]]:[-sd[1],sd[0]], r=(pitch||0)*D2R*face,   // toes point to the front, pitch + = toes down
    fd=[f0[0]*Math.cos(r)-f0[1]*Math.sin(r), f0[0]*Math.sin(r)+f0[1]*Math.cos(r)];
  const heel=add2(add2(ankle,sd,2.5),fd,-4), toe=add2(add2(ankle,sd,4.2),fd,12.5);
  const q=chain([heel,add2(add2(ankle,sd,3.6),fd,4),toe],t=>t<.5?7.4-t*1.2:6.8-(t-.5)*4.6,4); shadeBody(c,q,tone);
}
function drawHand(c,wrist,elbow,tone){ const d=dirv(ang(elbow,wrist)), q=chain([wrist,add2(wrist,d,6.5)],t=>6.2-t*1.4,3); shadeBody(c,q,tone); }
/* Torso: hips, waist, ribcage and shoulders along the spine, chest on the front side, glutes on the back. */
function drawTorso(c,P,face,tone){
  const d=dirv(ang(P.p,P.s)), L=dist(P.p,P.s), n=face>0?[-d[1],d[0]]:[d[1],-d[0]];   // n = front
  const prof=[[-.07,7,9.5],[.08,8.2,12],[.22,8,10.6],[.42,7.6,7.6],[.64,10.6,8.4],[.84,10.8,9.6],[1.0,7.6,9.6],[1.1,3.5,5.5]]; // [t, front, back]
  const F=prof.map(([t,f])=>add2(add2(P.p,d,t*L),n,f)), Bk=prof.map(([t,,b])=>add2(add2(P.p,d,t*L),n,-b)).reverse(), ring=[...F,...Bk];
  c.save(); c.beginPath(); c.moveTo((ring[0][0]+ring[1][0])/2,(ring[0][1]+ring[1][1])/2);
  for(let i=1;i<=ring.length;i++){ const a=ring[i%ring.length], b=ring[(i+1)%ring.length]; c.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2); }
  c.closePath(); c.fillStyle=tone[1]; c.fill(); c.clip();
  const lit=(n[0]*LIGHT[0]+n[1]*LIGHT[1])>0?1:-1, side=k=>add2(n,[0,0],k*lit);
  const g=c.createLinearGradient(...add2(add2(P.p,d,L*.5),n,-11*lit),...add2(add2(P.p,d,L*.5),n,11*lit));
  g.addColorStop(0,tone[2]); g.addColorStop(.45,tone[1]); g.addColorStop(.78,tone[0]); g.addColorStop(1,tone[1]);
  c.fillStyle=g; c.fillRect(Math.min(P.p[0],P.s[0])-40,Math.min(P.p[1],P.s[1])-40,Math.abs(P.s[0]-P.p[0])+80,Math.abs(P.s[1]-P.p[1])+80);
  // subtle pec / ab separation shading on the front
  c.globalAlpha=.18; c.strokeStyle=tone[2]; c.lineWidth=1.2; c.beginPath();
  const pc=add2(add2(P.p,d,L*.62),n,7.5); c.moveTo(...add2(pc,d,-1)); c.quadraticCurveTo(...add2(add2(pc,n,2.5),d,-5),...add2(add2(pc,n,-3),d,-8)); c.stroke();
  c.restore();
}
function drawHead(c,P,face,tone){
  const a=ang(P.s,P.h), d=dirv(a), n=face>0?[-d[1],d[0]]:[d[1],-d[0]];
  const nq=chain([add2(P.s,d,2),add2(P.h,d,-6)],()=>7.4,3); shadeBody(c,nq,tone);
  const cx=P.h[0]+n[0]*1.2, cy=P.h[1]+n[1]*1.2;
  c.save(); c.translate(cx,cy); c.rotate(a+Math.PI/2);
  const g=c.createRadialGradient(LIGHT[0]*4-1,LIGHT[1]*4,1,0,0,12.5); g.addColorStop(0,tone[0]); g.addColorStop(.55,tone[1]); g.addColorStop(1,tone[2]);
  c.fillStyle=g; c.beginPath(); c.ellipse(0,0,9.3,11.2,0,0,Math.PI*2); c.fill();
  c.restore();
  // jaw: a small chin bump on the face side keeps the head from reading as a ball
  const ch=add2(add2(P.h,d,-6.5),n,6.2); c.fillStyle=tone[1]; c.beginPath(); c.ellipse(ch[0],ch[1],3.6,3,a,0,Math.PI*2); c.fill();
}
function drawDumbbell(c,pt,COL,horiz){

/* Turns a day into warm-up, work and cool-down steps. Supersets alternate A, B, rest. */
function workSteps(id){
  const gym=isGym(id), W=y=>!y.bw && (gym || !!y.lb), out=[];
  DAY[id].list.forEach(x=>{
    if(!x.superset){ out.push({...x, kind:"work", weighted:W(x)}); return; }
    const [A,B] = x.superset;
    for(let r=1; r<=x.rounds; r++){
      out.push({...A, kind:"work", sets:1, round:r, rounds:x.rounds, superset:true, weighted:W(A), logKey:A.name, logIdx:r-1, cue:A.cue+` Then go straight to ${B.name.toLowerCase()}.`});
      out.push({...B, kind:"work", sets:1, round:r, rounds:x.rounds, superset:true, weighted:W(B), logKey:B.name, logIdx:r-1});
      if(r<x.rounds) out.push({name:"Rest", secs:x.rest, kind:"work", isRest:true, cue:`Superset rest. Next: ${A.name.toLowerCase()}, round ${r+1} of ${x.rounds}.`});
    }
  });
  return out;
}
function buildSteps(id){
  if(id==="M") return [...[WARM[0],WARM[1],WARM[2]].map(x=>({...x, kind:"warm"})), ...circuitSteps(), ...COOL_ALL.slice(0,3).map(x=>({...x, kind:"cool"}))];
  const gym=isGym(id), upper=id[0]==="U", pulls=/^U/.test(id) && !gym;
  const warm = [
    ...(gym ? [{name:"Incline walk", secs:180, cue:"3 minutes, brisk, at an incline. Then do one light warm-up set of your first exercise before the real sets."}] : []),
    ...(upper ? [WARM[0], WARM[3]] : [WARM[1], WARM[2], WARM[3]]),
    ...(pulls ? [HANG_STEP] : [])];
  const cool = [
    ...(gym ? [{name:"Incline walk", secs:480, cue:"Optional: 8 minutes at a brisk pace burns extra calories without hurting recovery. Skip it if you're short on time."}] : []),
    ...(upper ? [COOL_A, COOL_B, COOL_ALL[3]] : COOL_ALL)];
  return [...warm.map(x=>({...x, kind:"warm"})), ...workSteps(id), ...cool.map(x=>({...x, kind:"cool"}))];
}

const RUN_DAYS = {2:"easy", 5:"long"};   // optional: lifting is the priority, steps do most of the extra burning
const WD_NAMES = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function mondayOf(d){ const m=new Date(d); m.setHours(12,0,0,0); m.setDate(m.getDate()-((m.getDay()+6)%7)); return m; }
/* The plan starts the week someone first opens the app. Saved so it stays put. */
function runStart(){ let v=store.get("runStart"); if(!v){ v=isoDay(mondayOf(new Date())); store.set("runStart",v); } return new Date(v+"T12:00:00"); }
function runWeek(){ return Math.max(1, Math.round((mondayOf(new Date())-runStart())/(7*864e5))+1); }
function shiftWeek(d){ const st=runStart(); st.setDate(st.getDate()-7*d); if(st>mondayOf(new Date())) return; store.set("runStart", isoDay(st)); home(); }
function runPlan(w, type){
  const W=Math.min(Math.max(w,1),6);
  const jog=n=>({name:"Easy jog", secs:Math.round(n*60), kind:"run", cue:"Conversational pace. You should be able to talk in full sentences."});
  const walk=n=>({name:"Walk", secs:Math.round(n*60), kind:"run", cue:"Walk briskly and let your breathing settle."});
  if(W<=2){ const k=type==="long"?5:4, st=[]; for(let i=0;i<k;i++){ st.push(jog(4)); st.push(walk(1)); }
    return {title:type==="long"?"Long easy run":"Easy run", mins:k*5, summary:`${k} rounds of 4 min jog, 1 min walk`, steps:st}; }
  if(type==="easy"){ const m=W===3?25:30; return {title:"Easy run", mins:m, summary:`${m} min nonstop at an easy pace`, steps:[{...jog(m),name:"Easy run"}]}; }
  if(type==="long"){ const m={3:35,4:35,5:40,6:45}[W]; return {title:"Long easy run", mins:m, summary:`${m} min nonstop, slow and steady`,
    steps:[{...jog(m),name:"Long easy run",cue:"Slow and steady. Finishing matters more than pace."}]}; }
  if(W<=4){ const st=[{...jog(10),name:"Warm-up jog"}];
    for(let i=0;i<6;i++){ st.push({name:"Fast stride", secs:30, kind:"run", cue:"Fast but relaxed, about 85% effort. Stand tall, quick feet."}); st.push(walk(1.5)); }
    st.push({...jog(5),name:"Cool-down jog"});
    return {title:"Strides", mins:27, summary:"10 min warm-up, 6 fast 30-second strides, 5 min cool-down", steps:st}; }
  const m=W===5?15:20;
  return {title:"Tempo run", mins:15+m, summary:`10 min warm-up, ${m} min comfortably hard, 5 min cool-down`,
    steps:[{...jog(10),name:"Warm-up jog"},{name:"Comfortably hard", secs:m*60, kind:"run", cue:"A pace you could hold for about an hour. You can say a few words, not full sentences."},{...jog(5),name:"Cool-down jog"}]};
}

const dayMs=864e5, toDate=k=>new Date(k+"T12:00:00"), shortDate=k=>toDate(k).toLocaleDateString(undefined,{month:"short",day:"numeric"});
function weighTrend(w){
  if(w.length<2) return null;
  const last=toDate(w[w.length-1].date), pts=w.filter(e=>(last-toDate(e.date))/dayMs<=28);
  if(pts.length<2) return null;
  const xs=pts.map(e=>(toDate(e.date)-last)/dayMs), ys=pts.map(e=>e.lb);
  if(Math.max(...xs)-Math.min(...xs)<6) return null;
  const mx=xs.reduce((a,b)=>a+b)/xs.length, my=ys.reduce((a,b)=>a+b)/ys.length;
  let num=0, den=0; xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my); den+=(x-mx)**2;});
  return den ? num/den*7 : null;   // lb per week
}
function weighChart(w){
  if(!w.length) return "";
  const W=320,H=120,L=34,R=14,T=12,B=22;
  const x0=toDate(w[0].date)-0, x1=Math.max(toDate(w[w.length-1].date)-0, x0+14*dayMs);
  const lbs=w.map(e=>e.lb); let y0=Math.floor(Math.min(...lbs)-1), y1=Math.ceil(Math.max(...lbs)+1);
  if(y1-y0<4){ const m=(y0+y1)/2; y0=Math.floor(m-2); y1=Math.ceil(m+2); }
  const X=d=>L+(toDate(d)-x0)/(x1-x0)*(W-L-R), Y=v=>T+(y1-v)/(y1-y0)*(H-T-B);
  const ticks=[y0, Math.round((y0+y1)/2), y1];
  const pts=w.map(e=>`${X(e.date).toFixed(1)},${Y(e.lb).toFixed(1)}`).join(" ");
  const lastE=w[w.length-1], area=w.length>1?`<polygon points="${X(w[0].date).toFixed(1)},${H-B} ${pts} ${X(lastE.date).toFixed(1)},${H-B}" fill="var(--accent)" opacity=".12"/>`:"";
  return `<svg class="wchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight from ${shortDate(w[0].date)} to ${shortDate(lastE.date)}">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--surface-2)" stroke-width="1"/><text x="${L-6}" y="${Y(t)+3.5}" text-anchor="end">${t}</text>`).join("")}
    ${area}
    ${w.length>1?`<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:""}
    ${w.slice(0,-1).map(e=>`<circle cx="${X(e.date)}" cy="${Y(e.lb)}" r="2.5" fill="var(--accent)"/>`).join("")}
    <circle cx="${X(lastE.date)}" cy="${Y(lastE.lb)}" r="5.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2.5"/>
    <text x="${L}" y="${H-5}">${shortDate(w[0].date)}</text>

  </svg>`;
}

    ${last&&!weighOpen?`<p class="wprot">${protLine(last.lb)}</p>`:""}

/* ---------- session ---------- */
function start(){

function cur(){return S.steps[S.i];}

const gymKey = s => "gym:"+(s.logKey||s.name);
function prevRec(s){ S.prev = S.prev||{}; const k=gymKey(s); if(!(k in S.prev)) S.prev[k]=store.get(k); return S.prev[k]; }
function prevSet(s){ const pv=prevRec(s); if(!pv||!Array.isArray(pv.sets)) return null; return pv.sets[s.logIdx ?? S.set-1] || pv.sets.filter(Boolean).slice(-1)[0] || null; }

function bumpLb(d){ const i=document.getElementById("lbIn"); const v=parseFloat(i&&i.value); S.lb=Math.max(0,(isNaN(v)?0:v)+d); if(i) i.value=S.lb; }

  if(sets.length){
    const same = sets.every(x=>x.lb===sets[0].lb);
    last = `Last time, ${esc(shortDate(pv.date))}: ` + (same && sets[0].lb!=null ? `${sets[0].lb} lb for ${sets.map(x=>x.reps).join(", ")} reps` : sets.map(fmtSet).join(", "));
  }

  return `<div class="wt">
      <div class="wthead"><span class="unit">${s.assist?"Assistance":"Weight"}${s.perDb?", each dumbbell":""}</span>${mine&&mine.lb!=null?`<span class="lastchip">Last time this set: <b>${mine.lb} lb × ${mine.reps}</b></span>`:""}</div>

/* One-line weight control used above the set table; the table already shows last time's numbers. */
function weightCompact(s){

function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

   <div class="playtop">
     <button class="close" onclick="askEnd()" aria-label="End workout">
       <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
     <span class="phase">${kinds[s.kind]}, ${pos} of ${inKind.length}</span>
     <span style="width:40px"></span>
   </div>
   <div class="stage player-stage"><canvas id="demo" data-anim="${ANIM_BY_NAME[s.name]||""}" role="img" aria-label="Animated demo of ${esc(s.name)}"></canvas>
     ${s.kind==="run"?"":`<a href="${yt(s.q||s.name)}" target="_blank" rel="noopener">Watch video</a>`}</div>
   <div class="title"><h2${s.name.length>18?' style="font-size:2.35rem"':''}>${esc(s.name)}</h2>${s.target?`<p class="target">${esc(s.target)}</p>`:""}</div>
   ${metric}
   <p class="cue">${esc(s.cue)}</p>
   <div class="dock"><div class="dock-in">
     ${dock}
     <div class="minor"><button onclick="back()" ${S.i===0?"disabled":""}>Previous</button>
       <span>${nxt?`Next: <b>${esc(nxt.name)}</b>`:"Last one"}</span>
       <button onclick="next()">Skip</button></div>
   </div></div>`);
}

function goalLine(){
  const n=sessionsIn(isoDay(mondayOf(new Date()))), g=weekGoal(), st=weekStreak(), C=2*Math.PI*18, f=Math.min(1,n/g);
  const msg = n>=g ? (n===g ? `Weekly goal hit${st>1?`. ${st}-week streak`:""}.` : `${n} sessions this week, past your goal of ${g}.`) : `${g-n} more this week to hit your goal${st?` and keep your ${st}-week streak`:""}.`;
  return `<div class="goalline"><svg viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="18" fill="none" stroke="var(--surface-3)" stroke-width="6"/><circle cx="23" cy="23" r="18" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}"/></svg>
    <div><b>${n} of ${g} this week</b><p class="small muted">${msg}</p></div></div>`;
}
function askEnd(){
  const logged = S.day==="R" ? S.i>0 : Object.keys(S.logs||{}).length>0;
  if(!logged && S.i<2){ home(); return; }
  const wasRunning=S.running; stopTimer();
  const el=document.createElement("div"); el.className="sheet-bg"; el.id="sheet";
  const close=()=>{ el.remove(); if(wasRunning) runTimer(); draw(); };
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"><h3 id="shT">End workout?</h3>
    <p>${logged?"Your logged sets are saved and it counts toward your week.":"Nothing logged yet, so this won't count toward your week."}</p>
    <button class="btn primary" data-a="keep">Keep going</button>
    ${logged?`<button class="btn" data-a="save">Finish and save</button>`:""}
    <button class="btn danger" data-a="drop">${logged?"Discard workout":"End without saving"}</button></div>`;
  el.addEventListener("click",e=>{ const a=e.target.dataset&&e.target.dataset.a; if(e.target===el||a==="keep") close(); else if(a==="save"){ el.remove(); finish(); } else if(a==="drop"){ el.remove(); home(); } });
  el.addEventListener("keydown",e=>{ if(e.key==="Escape") close(); });
  document.body.appendChild(el); el.querySelector("[data-a=keep]").focus();
}
function finish(){
  stopTimer(); setPhase("done");
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; }
  if(S.day==="R"){
    const mins=Math.max(1,Math.round((Date.now()-S.t0)/60000)), hist=getHistory();
    hist.push({date:isoDay(new Date()), day:"R", title:S.runTitle, mins:S.runMins}); store.set("history", hist.slice(-200));
    const dates=new Set(store.get("doneDates")||[]); dates.add(isoDay(new Date())); store.set("doneDates",[...dates].slice(-60));
    $(`<div class="done-hero"><div class="done-mark" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><p class="eyebrow">Run complete</p><h1>${esc(S.runTitle)}</h1>
        <p class="muted">Stretch your calves and hamstrings, and drink some water.</p></div>
      ${weekStrip()}
      ${goalLine()}
      <div class="stats"><div class="stat"><b>${S.runMins}</b><span>min planned</span></div>
        <div class="stat"><b>${mins}</b><span>min on timer</span></div>
        <div class="stat"><b>${runWeek()}</b><span>plan week</span></div></div>
      <div class="dock"><div class="dock-in"><button class="btn primary" onclick="home()">Done</button></div></div>`);
    return;
  }
  Object.entries(S.logs).forEach(([k,v])=>store.set("log:"+k, v));
  const date = new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  if(ORDER.includes(S.day.slice(0,2))) store.set("lastDay", S.day.slice(0,2));
  store.set("lastDone", {day: S.day==="M"?"Minimum":S.day, date});
  const dates = new Set(store.get("doneDates")||[]); dates.add(isoDay(new Date())); store.set("doneDates", [...dates].slice(-60));
  const mins = Math.max(1, Math.round((Date.now()-S.t0)/60000));
  const totalReps = Object.values(S.logs).flat().filter(Boolean).reduce((a,b)=>a+ +b,0);
  const hist = getHistory(); hist.push({date: isoDay(new Date()), day: S.day, mins, reps: totalReps}); store.set("history", hist.slice(-200));
  /* personal bests: heaviest weight for gym lifts, most reps in one set for bodyweight */
  const bests = store.get("bests")||{}, newPB = new Set();
  Object.entries(S.logs).forEach(([k,v])=>{
    const reps=Math.max(0,...v.filter(Boolean).map(Number));
    const lbs=((S.disp&&S.disp[k])||[]).filter(x=>String(x).includes("×")).map(x=>parseFloat(x)).filter(x=>!isNaN(x));
    const lb=lbs.length?Math.max(...lbs):null;
    const was=bests[k];
    if(lb!=null){ if(was&&was.lb!=null&&lb>was.lb) newPB.add(k); if(!was||was.lb==null||lb>was.lb) bests[k]={lb}; }
    else if(reps>0){ if(was&&was.reps!=null&&reps>was.reps) newPB.add(k); if(!was||was.reps==null||reps>was.reps) bests[k]={reps}; }
  });
  store.set("bests", bests);
  const rows = Object.entries(S.logs).map(([k,v])=>`<div><span>${esc(k)}${newPB.has(k)?'<i class="pb">PR</i>':""}</span><span>${((S.disp&&S.disp[k])||v).filter(Boolean).map(x=>esc(String(x).replace("×"," × "))).join(", ")}</span></div>`).join("");
  const nEx = Object.keys(S.logs).length || new Set(S.steps.filter(x=>x.kind==="work"&&!x.isRest).map(x=>x.logKey||x.name)).size;
  pick = suggested();
  $(`
   <div class="done-hero"><div class="done-mark" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><p class="eyebrow">Workout complete</p><h1>${esc(dayTitle(S.day))}</h1>
     <p class="muted">${newPB.size ? `${newPB.size} personal record${newPB.size>1?"s":""}. ` : ""}${S.day==="M" ? "Short sessions still count toward your week." : `Next time: ${esc(PLAN[pick].title)}, ${esc(PLAN[pick].focus.toLowerCase())}.`}</p></div>
   ${weekStrip()}
   ${goalLine()}
   <div class="stats">
     <div class="stat"><b>${mins}</b><span>${mins===1?"minute":"minutes"}</span></div>
     <div class="stat"><b>${nEx}</b><span>${nEx===1?"exercise":"exercises"}</span></div>
     <div class="stat"><b>${totalReps}</b><span>reps logged</span></div>
   </div>
   ${rows? `<div class="section"><h3>Your sets</h3><div class="list">${rows}</div><p class="muted small" style="padding-top:8px">Next time, each set starts at these numbers. Try to beat one.</p></div>`:""}
   <div class="dock"><div class="dock-in"><button class="btn primary" onclick="home()">Done</button></div></div>`);
}

home();
/* Offline: cache the app's own files after the first visit. Skipped when opened as a local file. */
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
  const hadWorker = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
  // A new version took over: reload once so it shows straight away (not mid-workout).
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(hadWorker && !document.querySelector(".playtop") && !window.__reloaded){ window.__reloaded=true; location.reload(); } });
}
</script>

</body>
</html>
