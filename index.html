/* KONG TRAINING
   Concept: the screen itself tells you where you are. Each phase owns one full-bleed colour:
   warm-up = banana, workout = jungle, cool-down = sage, run = sky, finish = banana.
   One heavy condensed face for headlines and numbers; native system text for everything else. */
:root{
  --jungle:#0c1410; --canopy:#141f19; --moss:#1f2c25; --bone:#edf0e6; --lichen:#8c9c91;
  --banana:#ffd23f; --sage:#b9d8c2; --sky:#8fd3ff;
  --bg:var(--jungle); --surface:var(--canopy); --surface-2:var(--moss); --ink:var(--bone); --muted:var(--lichen);
  --accent:var(--banana); --accent-ink:#161204;
  --fig:var(--bone); --fig-far:rgba(237,240,230,.34); --prop:#2e3d35; --floor:#26342c; --shadow:rgba(0,0,0,.45); --db:var(--banana);
  --stage-hi:#1c2922; --stage-lo:#101914;
  --display:"Big Shoulders","Big Shoulders Display","Arial Narrow","Helvetica Neue Condensed",Impact,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --gx:max(16px,env(safe-area-inset-left,0px)); --gxr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
/* light tones: banana, sage, sky */
:root[data-phase="warm"],:root[data-phase="done"],.tone-banana{
  --bg:var(--banana); --surface:rgba(22,18,4,.07); --surface-2:rgba(22,18,4,.13); --ink:#161204; --muted:rgba(22,18,4,.62);
  --accent:#161204; --accent-ink:var(--banana);
  --fig:#161204; --fig-far:rgba(22,18,4,.3); --prop:rgba(22,18,4,.26); --floor:rgba(22,18,4,.2); --shadow:rgba(22,18,4,.16); --db:#1d6b46;
  --stage-hi:rgba(255,255,255,.28); --stage-lo:rgba(255,255,255,0)}
:root[data-phase="cool"],.tone-sage{
  --bg:var(--sage); --surface:rgba(8,26,16,.07); --surface-2:rgba(8,26,16,.13); --ink:#0b1a12; --muted:rgba(11,26,18,.62);
  --accent:#0b1a12; --accent-ink:var(--sage);
  --fig:#0b1a12; --fig-far:rgba(11,26,18,.3); --prop:rgba(11,26,18,.24); --floor:rgba(11,26,18,.2); --shadow:rgba(11,26,18,.14); --db:#0b1a12;
  --stage-hi:rgba(255,255,255,.3); --stage-lo:rgba(255,255,255,0)}
:root[data-phase="run"],.tone-sky{
  --bg:var(--sky); --surface:rgba(4,20,32,.07); --surface-2:rgba(4,20,32,.13); --ink:#06141f; --muted:rgba(6,20,31,.62);
  --accent:#06141f; --accent-ink:var(--sky);
  --fig:#06141f; --fig-far:rgba(6,20,31,.3); --prop:rgba(6,20,31,.24); --floor:rgba(6,20,31,.2); --shadow:rgba(6,20,31,.14); --db:#06141f;
  --stage-hi:rgba(255,255,255,.3); --stage-lo:rgba(255,255,255,0)}
*{box-sizing:border-box}
html{background:var(--bg);transition:background-color .35s ease}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px 180px}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{margin:0;text-wrap:balance}
h1,h2{font-family:var(--display);font-weight:900;text-transform:uppercase;letter-spacing:-.005em;line-height:.88}
h1{font-size:3.4rem}
h2{font-size:2.9rem}
h3{font-size:1.0625rem;font-weight:700;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* masthead */
.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:6px}
.wordmark{display:flex;flex-direction:column;gap:6px}
.wordmark b{font-family:var(--display);font-weight:900;font-size:4.6rem;line-height:.72;text-transform:uppercase;letter-spacing:-.01em}
.wordmark span{font-size:.875rem;color:var(--muted)}
.tally{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.tally b{font-family:var(--display);font-weight:900;font-size:2.6rem;line-height:.8;color:var(--accent);font-variant-numeric:tabular-nums}
.tally span{font-size:.8125rem;color:var(--muted)}

/* weekly goal ring (masthead) */
.goal{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:right;color:var(--ink)}
.goal svg{width:58px;height:58px;transform:rotate(-90deg);flex:none}
.goal .gtxt{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.goal .gtxt b{font-family:var(--display);font-weight:900;font-size:1.9rem;line-height:.8;font-variant-numeric:tabular-nums}
.goal .gtxt b small{font-size:.6em;color:var(--muted)}
.goal .gtxt span{font-size:.75rem;color:var(--muted);font-weight:600;white-space:nowrap}
.goal .gtxt .streak{color:var(--banana)}
.goalset{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-radius:16px;padding:10px 10px 10px 16px}
.goalset .stepper{padding:4px;background:var(--bg)}
.goalset .stepper button{width:44px;height:44px}
.goalset .stepper output{font-size:2rem;min-width:44px}
/* week: tall slots */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);min-width:0}
.wd i{width:100%;height:52px;border-radius:12px;background:var(--surface);display:grid;place-items:center;font-style:normal;
  font-family:var(--display);font-weight:800;font-size:1.25rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wd.on i{background:var(--banana);color:#161204}
.wd i.sm{font-size:.95rem;letter-spacing:-.02em}
.wd.today i{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.wd.on.today i{box-shadow:inset 0 0 0 2px var(--ink);color:#161204}
.wd.today span{color:var(--ink);font-weight:700}

/* workout picker: one row of chips, home first, then gym */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * var(--gx)) calc(-1 * var(--gxr));padding:2px var(--gxr) 2px var(--gx);scroll-padding-inline:var(--gx)}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:0;border-radius:99px;min-height:44px;padding:0 18px;background:var(--surface);color:var(--ink);font-weight:600;font-size:.9375rem;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips .div{flex:none;width:1px;background:var(--surface-2);margin:8px 2px}
details.grpd{border-radius:16px;background:var(--surface);margin:6px 0}
details.grpd summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;min-height:52px}
details.grpd summary::-webkit-details-marker{display:none}
details.grpd summary b{font-weight:600}
details.grpd summary span{font-size:.875rem;color:var(--muted)}
details.grpd summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 0;transition:transform .2s}
details.grpd[open] summary::after{transform:rotate(-135deg);margin-top:4px}
details.grpd .inner{padding:0 16px 8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border-radius:14px;padding:4px}
.seg button{border:0;background:none;border-radius:10px;padding:10px 4px;cursor:pointer;font-weight:600;font-size:.9375rem;color:var(--muted);min-width:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* poster: today's workout */
.poster{background:var(--bg);color:var(--ink);border-radius:26px;overflow:hidden;display:grid;grid-template-columns:1fr;position:relative}
.poster canvas{display:block;width:100%;height:190px}
.poster-txt{padding:4px 22px 22px;display:flex;flex-direction:column;gap:10px}
.poster h2{font-size:3.6rem}
.poster .meta{font-weight:600}
.poster .kicker{font-size:.875rem;color:var(--muted);font-weight:600}

/* run box */
.runbox{background:var(--bg);color:var(--ink);border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.runtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.runtop h2{font-size:2.2rem}
.runbox .meta{font-size:.9375rem}
.runbtns{display:flex;gap:8px}
.runbtns .btn{flex:1 1 0;min-height:48px;padding:12px 14px;font-size:1rem}
.wkctl{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:.8125rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.wkctl button{width:28px;height:28px;border-radius:50%;border:0;background:var(--surface-2);cursor:pointer;font-size:1rem;line-height:1}
.wkctl button:disabled{opacity:.3;cursor:default}
.runlist{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:8px}

.row{display:flex;align-items:center;gap:14px;padding:7px 0}

.row div{display:flex;flex-direction:column;min-width:0}
.row b{font-weight:600}
.row span{font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums}
.list{background:var(--surface);border-radius:18px;padding:2px 16px}

.bars i{flex:1;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}

.bars i.done b{width:100%}
.bars i.now b{background:var(--ink);opacity:.55}
.playtop{display:flex;justify-content:space-between;align-items:center;margin-top:-8px}
.close{width:40px;height:40px;border-radius:50%;background:var(--surface);border:0;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.phase{font-size:.875rem;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.player-stage{margin-left:calc(-1 * var(--gx));margin-right:calc(-1 * var(--gxr));height:min(34vh,280px);margin-top:-10px}
.player-stage a{position:absolute;right:var(--gxr);bottom:10px;font-size:.8125rem;color:var(--ink);background:var(--surface-2);padding:6px 11px;border-radius:99px;text-decoration:none;font-weight:600}
.title{display:flex;flex-direction:column;gap:6px}
.title h2{font-size:3.1rem}
.target{font-size:1.0625rem;font-weight:700;color:var(--ink);opacity:.85}
:root:not([data-phase]) .target,:root[data-phase="work"] .target{color:var(--banana);opacity:1}
.cue{color:var(--muted);max-width:60ch;font-size:.9375rem}
.metric{display:flex;align-items:center;justify-content:space-between;gap:16px}
.ringwrap{position:relative;width:148px;height:148px;flex:none}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .num{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.big{font-family:var(--display);font-weight:900;font-size:4rem;line-height:.9;font-variant-numeric:tabular-nums}
.big.long{font-size:3.1rem}
.huge{font-family:var(--display);font-weight:900;font-size:6.5rem;line-height:.78;font-variant-numeric:tabular-nums}
.unit{font-family:var(--sans);font-size:.875rem;color:var(--muted);font-weight:600;letter-spacing:0}
.setcol{display:flex;flex-direction:column;gap:8px}
.stepper{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:20px;padding:6px}

.stepper output{min-width:58px;text-align:center;font-family:var(--display);font-weight:900;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.steplbl{font-size:.75rem;color:var(--muted);text-align:center;margin-top:4px}
.side{display:flex;flex-direction:column;gap:8px;align-items:flex-end;text-align:right;min-width:0}

/* set dots, last-time line, rest adjust, end sheet */
.dots{display:flex;gap:6px;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--surface-2)}
.dots i.on{background:var(--ink)}
:root:not([data-phase]) .dots i.on,:root[data-phase="work"] .dots i.on{background:var(--banana)}
.lastline{font-size:.875rem;color:var(--muted);text-align:center;margin-top:6px}
.lastline b{color:var(--ink)}
.radj{display:flex;gap:8px}
.radj button{min-width:64px;min-height:44px;border-radius:14px;border:0;background:var(--surface-2);color:var(--ink);font-weight:700;font-size:.9375rem;cursor:pointer;font-variant-numeric:tabular-nums}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:0 var(--gxr) calc(16px + env(safe-area-inset-bottom,0px)) var(--gx);animation:fade .18s ease}
.sheet{width:100%;max-width:480px;background:var(--canopy);color:var(--bone);border-radius:24px;padding:22px 18px 18px;display:flex;flex-direction:column;gap:10px;animation:rise .22s cubic-bezier(.2,.8,.2,1)}
.sheet h3{font-family:var(--display);font-weight:900;font-size:2rem;text-transform:uppercase;line-height:.9}
.sheet p{color:var(--lichen);font-size:.9375rem;margin-bottom:6px}
.sheet .btn{width:100%;background:var(--moss);color:var(--bone)}

.sheet .btn.danger{background:none;color:#ff9a7a;min-height:48px}

.dock-in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.dock-row{display:flex;gap:10px}
.dock-row > *{flex:1 1 0;min-width:0}
.btn{border:0;border-radius:18px;padding:17px 18px;font-weight:700;font-size:1.0625rem;cursor:pointer;background:var(--surface-2);color:var(--ink);min-height:58px}

.err{color:#ff9a7a;font-weight:600;font-size:.875rem}
.wlist{background:var(--bg)}
.wlist b{color:var(--ink);font-weight:700}
.x{background:none;border:0;color:var(--muted);font-size:1.2rem;line-height:1;cursor:pointer;padding:4px 6px;margin-left:4px}
/* gym */
.picker{display:flex;flex-direction:column;gap:6px}
.seg2{grid-template-columns:auto 1fr 1fr;align-items:center}
.seg2 span{padding:0 10px 0 8px;font-size:.8125rem;color:var(--muted);font-weight:600;white-space:nowrap}
.badge-l.g{background:var(--bone);color:#0c1410;font-size:1.05rem}
.wt{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.wthead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.lastchip{font-size:.8125rem;color:var(--muted)}
.lastchip b{color:var(--ink)}
.wtrow{display:flex;align-items:center;gap:10px}
.wt .stepper{background:var(--bg)}

.tip{color:var(--banana);font-weight:600}

.done-hero{display:flex;flex-direction:column;gap:12px;padding-top:28px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font-family:var(--display);font-size:2.6rem;font-weight:900;line-height:.85;font-variant-numeric:tabular-nums}
.stat span{font-size:.8125rem;color:var(--muted)}

.goalline{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:12px 14px}
.goalline svg{width:46px;height:46px;transform:rotate(-90deg);flex:none}
:root[data-phase="done"] .goalline svg circle:last-child{stroke:#161204}
.wd.on i{background:var(--banana)}
:root[data-phase="done"] .wd.on i{background:#161204;color:var(--banana)}
@media (prefers-reduced-motion:reduce){html{transition:none}*{transition:none!important}}

const LIMBS = ["h","s","p","e","w","k","f","e2","w2","k2","f2"];
function fill(p){ const q={...p};
  for(const [far,near] of [["e2","e"],["w2","w"],["k2","k"],["f2","f"]]) if(!q[far]) q[far]=[q[near][0]-4,q[near][1]];
  return q; }
const ease = u => u*u*(3-2*u);
function poseAt(a, T){
  if(a.fn) return fill(a.fn((T % a.ms)/a.ms));
  const n=a.keys.length, seg=Math.floor(T/a.ms)%n, u=(T%a.ms)/a.ms;
  const v=ease(Math.min(1,Math.max(0,(u-0.15)/0.7)));
  const A=fill(a.keys[seg]), B=fill(a.keys[(seg+1)%n]), out={};
  for(const k of LIMBS) out[k]=[A[k][0]+(B[k][0]-A[k][0])*v, A[k][1]+(B[k][1]-A[k][1])*v];
  return out;
}

const BOUNDS={};
function boundsFor(name){
  if(BOUNDS[name]) return BOUNDS[name];
  const a=ANIM[name]; if(!a) return [0,-30,300,190];
  let b=[1e9,1e9,-1e9,-1e9]; const add=(x,y)=>{b[0]=Math.min(b[0],x);b[1]=Math.min(b[1],y);b[2]=Math.max(b[2],x);b[3]=Math.max(b[3],y);};
  const members = a.seq ? a.seq.map(q=>ANIM[q[1]]) : [a];
  for(const m of members){
    const poses = m.fn ? Array.from({length:12},(_,i)=>fill(m.fn(i/12))) : m.keys.map(fill);
    for(const p of poses) for(const k of LIMBS) add(p[k][0],p[k][1]);
    const pr=m.props||{};
    if(pr.bar){ add(90,-30); add(210,-7); }
    if(pr.cable) add(pr.cable[0],pr.cable[1]);
    if(pr.lines) pr.lines.forEach(l=>{ add(l[0],l[1]); add(l[2],l[3]); });
    if(pr.plate) poses.forEach(q=>{ add(q.f[0]+26,q.f[1]-26); add(q.f[0]-26,q.f[1]+26); });
    if(pr.chair){ add(pr.chair[0],pr.chair[2]); add(pr.chair[1],pr.chair[2]); }
    if(pr.wall!=null) add(pr.wall-8,100);
    if(pr.door!=null) add(pr.door-4,100);
  }
  add(b[0],186);
  b=[b[0]-16,b[1]-16,b[2]+16,b[3]+6];
  return BOUNDS[name]=b;
}
function stillTime(name){ let a=ANIM[name]; if(!a) return 0; if(a.seq) a=ANIM[a.seq[0][1]]; return a.fn ? a.ms*.3 : a.ms*.95; }

  const done = new Set(store.get("doneDates")||[]), now = new Date();
  const byDate = {}; getHistory().forEach(e=>{ (byDate[e.date] = byDate[e.date]||[]).push(LETTER[e.day]); });
  const mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay()+6)%7));
  return `<div class="week" aria-label="This week">${["M","T","W","T","F","S","S"].map((l,i)=>{
    const d = new Date(mon); d.setDate(mon.getDate()+i); const key = isoDay(d);
    const did = byDate[key], u = did ? [...new Set(did)] : [], label = did ? (u.length>2 ? u[0]+"+"+(u.length-1) : u.join("+")) : d.getDate();
    const title = did ? ` title="${did.map(x=>LETTER_NAME[x]||x).join(", ")}"` : "";
    return `<div class="wd ${(did||done.has(key))?"on":""} ${key===isoDay(now)?"today":""}"${title}><span>${l}</span><i${String(label).length>2?' class="sm"':""}>${label}</i></div>`;
  }).join("")}</div>`;
}
/* ---------- running plan (6 weeks, runs Mon / Wed / Fri / Sat) ---------- */
const RUN_DAYS = {0:"easy", 2:"easy", 4:"fast", 5:"long"};
const WD_NAMES = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function mondayOf(d){ const m=new Date(d); m.setHours(12,0,0,0); m.setDate(m.getDate()-((m.getDay()+6)%7)); return m; }
/* The plan starts the week someone first opens the app. Saved so it stays put. */
function runStart(){ let v=store.get("runStart"); if(!v){ v=isoDay(mondayOf(new Date())); store.set("runStart",v); } return new Date(v+"T12:00:00"); }
function runWeek(){ return Math.max(1, Math.round((mondayOf(new Date())-runStart())/(7*864e5))+1); }
function shiftWeek(d){ const st=runStart(); st.setDate(st.getDate()-7*d); if(st>mondayOf(new Date())) return; store.set("runStart", isoDay(st)); home(); }
function runPlan(w, type){
  const W=Math.min(Math.max(w,1),6);
  const jog=n=>({name:"Easy jog", secs:Math.round(n*60), kind:"run", cue:"Conversational pace. You should be able to talk in full sentences."});
  const walk=n=>({name:"Walk", secs:Math.round(n*60), kind:"run", cue:"Walk briskly and let your breathing settle."});
  if(W<=2){ const k=type==="long"?5:4, st=[]; for(let i=0;i<k;i++){ st.push(jog(4)); st.push(walk(1)); }
    return {title:type==="long"?"Long easy run":"Easy run", mins:k*5, summary:`${k} rounds of 4 min jog, 1 min walk`, steps:st}; }
  if(type==="easy"){ const m=W===3?25:30; return {title:"Easy run", mins:m, summary:`${m} min nonstop at an easy pace`, steps:[{...jog(m),name:"Easy run"}]}; }
  if(type==="long"){ const m={3:35,4:35,5:40,6:45}[W]; return {title:"Long easy run", mins:m, summary:`${m} min nonstop, slow and steady`,
    steps:[{...jog(m),name:"Long easy run",cue:"Slow and steady. Finishing matters more than pace."}]}; }
  if(W<=4){ const st=[{...jog(10),name:"Warm-up jog"}];
    for(let i=0;i<6;i++){ st.push({name:"Fast stride", secs:30, kind:"run", cue:"Fast but relaxed, about 85% effort. Stand tall, quick feet."}); st.push(walk(1.5)); }
    st.push({...jog(5),name:"Cool-down jog"});
    return {title:"Strides", mins:27, summary:"10 min warm-up, 6 fast 30-second strides, 5 min cool-down", steps:st}; }
  const m=W===5?15:20;
  return {title:"Tempo run", mins:15+m, summary:`10 min warm-up, ${m} min comfortably hard, 5 min cool-down`,
    steps:[{...jog(10),name:"Warm-up jog"},{name:"Comfortably hard", secs:m*60, kind:"run", cue:"A pace you could hold for about an hour. You can say a few words, not full sentences."},{...jog(5),name:"Cool-down jog"}]};
}
function ranOn(key){ return getHistory().some(e=>e.date===key && e.day==="R"); }
/* Only today's run can be removed. Past days are locked. */
function unlogRun(){
  const today=isoDay(new Date());
  const hist=getHistory().filter(e=>!(e.date===today && e.day==="R"));
  store.set("history", hist);
  if(!hist.some(e=>e.date===today)){ const dates=new Set(store.get("doneDates")||[]); dates.delete(today); store.set("doneDates",[...dates]); }
  home();
}
function logRun(type){
  const p=runPlan(runWeek(),type), hist=getHistory();
  hist.push({date:isoDay(new Date()), day:"R", title:p.title, mins:p.mins}); store.set("history", hist.slice(-200));
  const dates=new Set(store.get("doneDates")||[]); dates.add(isoDay(new Date())); store.set("doneDates",[...dates].slice(-60));
  home();
}
function startRun(type){
  const p=runPlan(runWeek(),type);
  S = {day:"R", runType:type, runTitle:p.title, runMins:p.mins, steps:p.steps, i:0, set:1, phase:"work", left:0, total:0, running:false, logs:{}, t:null, reps:0, t0:Date.now()};
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  if(navigator.wakeLock){ navigator.wakeLock.request("screen").then(w=>wakeLock=w).catch(()=>{}); }
  enter();
}
let showAll = false;
function historyBlock(){
  const h = getHistory().slice().reverse();
  if(!h.length) return `<div class="section"><h3>History</h3><p class="muted small">Finish a workout and it shows up here with the date and which day you did.</p></div>`;
  const list = showAll ? h : h.slice(0,5);
  return `<div class="section"><div class="sechead"><h3>History</h3><span class="muted small">${h.length} ${h.length===1?"workout":"workouts"}</span></div>
    <div class="list hist">${list.map(e=>{
      const d = new Date(e.date+"T12:00:00");
      return `<div><span class="hl"><i class="badge-l ${e.day==="M"?"q":e.day==="R"?"r":GYM_DAYS[e.day]?"g":""}">${LETTER[e.day]}</i><span><b>${esc(e.title||(DAY[e.day]||{}).title||"Workout")}</b><br><span class="muted small">${esc(d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}))}</span></span></span>
        <span class="small">${e.mins} min${e.reps?`<br>${e.reps} reps`:""}</span></div>`;}).join("")}</div>
    ${h.length>5?`<button class="morebtn" onclick="showAll=!showAll;home()">${showAll?"Show less":"Show all "+h.length}</button>`:""}</div>`;
}
/* ---------- weight check-ins ---------- */
let weighOpen=false, weighErr="";
function getWeights(){
  const w=store.get("weights");
  return (Array.isArray(w)?w:[]).slice().sort((a,b)=>a.date<b.date?-1:1);
}
function saveWeight(){
  const v=parseFloat((document.getElementById("wIn")||{}).value);
  if(!(v>=70 && v<=400)){ weighErr="Enter your weight in pounds, like 154.6."; home(); return; }
  const key=isoDay(new Date()), w=getWeights().filter(e=>e.date!==key);
  w.push({date:key, lb:Math.round(v*10)/10}); store.set("weights",w);
  weighOpen=false; weighErr=""; home();
}
function delWeight(d){ store.set("weights", getWeights().filter(e=>e.date!==d)); home(); }
const dayMs=864e5, toDate=k=>new Date(k+"T12:00:00"), shortDate=k=>toDate(k).toLocaleDateString(undefined,{month:"short",day:"numeric"});
function weighTrend(w){
  if(w.length<2) return null;
  const last=toDate(w[w.length-1].date), pts=w.filter(e=>(last-toDate(e.date))/dayMs<=28);
  if(pts.length<2) return null;
  const xs=pts.map(e=>(toDate(e.date)-last)/dayMs), ys=pts.map(e=>e.lb);
  if(Math.max(...xs)-Math.min(...xs)<6) return null;
  const mx=xs.reduce((a,b)=>a+b)/xs.length, my=ys.reduce((a,b)=>a+b)/ys.length;
  let num=0, den=0; xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my); den+=(x-mx)**2;});
  return den ? num/den*7 : null;   // lb per week
}
function weighChart(w){
  if(!w.length) return "";
  const W=320,H=120,L=34,R=14,T=12,B=22;
  const x0=toDate(w[0].date)-0, x1=Math.max(toDate(w[w.length-1].date)-0, x0+14*dayMs);
  const lbs=w.map(e=>e.lb); let y0=Math.floor(Math.min(...lbs)-1), y1=Math.ceil(Math.max(...lbs)+1);
  if(y1-y0<4){ const m=(y0+y1)/2; y0=Math.floor(m-2); y1=Math.ceil(m+2); }
  const X=d=>L+(toDate(d)-x0)/(x1-x0)*(W-L-R), Y=v=>T+(y1-v)/(y1-y0)*(H-T-B);
  const ticks=[y0, Math.round((y0+y1)/2), y1];
  const pts=w.map(e=>`${X(e.date).toFixed(1)},${Y(e.lb).toFixed(1)}`).join(" ");
  const lastE=w[w.length-1], area=w.length>1?`<polygon points="${X(w[0].date).toFixed(1)},${H-B} ${pts} ${X(lastE.date).toFixed(1)},${H-B}" fill="var(--banana)" opacity=".12"/>`:"";
  return `<svg class="wchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight from ${shortDate(w[0].date)} to ${shortDate(lastE.date)}">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--surface-2)" stroke-width="1"/><text x="${L-6}" y="${Y(t)+3.5}" text-anchor="end">${t}</text>`).join("")}
    ${area}
    ${w.length>1?`<polyline points="${pts}" fill="none" stroke="var(--banana)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:""}
    ${w.slice(0,-1).map(e=>`<circle cx="${X(e.date)}" cy="${Y(e.lb)}" r="2.5" fill="var(--banana)"/>`).join("")}
    <circle cx="${X(lastE.date)}" cy="${Y(lastE.lb)}" r="5.5" fill="var(--banana)" stroke="var(--surface)" stroke-width="2.5"/>
    <text x="${L}" y="${H-5}">${shortDate(w[0].date)}</text>
    <text x="${W-R}" y="${H-5}" text-anchor="end">${shortDate(isoDay(new Date(x1)))}</text>
  </svg>`;
}
function weighCard(){
  const w=getWeights(), now=new Date(), today=isoDay(now);
  const last=w[w.length-1], first=w[0];
  const daysSince = last ? Math.round((toDate(today)-toDate(last.date))/dayMs) : null;
  const due = !last || daysSince>=7, rate=weighTrend(w);
  let pill="", note="";
  if(rate==null){
    const nd=last?new Date(toDate(last.date)-0+7*dayMs):now;
    pill=`<span class="pill">Building trend</span>`;
    note=!last?"Log your first weigh-in to start tracking.":due?"Check in today to see your weekly trend.":`Check in again on ${nd.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})} to see your weekly trend.`;
  } else {
    const r=Math.abs(rate).toFixed(1);
    if(rate<=-1.6){ pill=`<span class="pill warn">Dropping fast</span>`; note=`Losing ${r} lb a week. Faster than 1.5 lb a week can cost muscle, so eat enough protein and don't skip meals.`; }
    else if(rate<=-0.3){ pill=`<span class="pill good">On track</span>`; note=`Losing ${r} lb a week. That's the right pace to drop fat and keep your muscle.`; }
    else if(rate<0.3){ pill=`<span class="pill">Holding steady</span>`; note=`About the same for the last few weeks. If it stays flat 2 more weeks, eat out less or add a walk on rest days.`; }
    else { pill=`<span class="pill up">Going up</span>`; note=`Up ${r} lb a week. Look at how often you're eating out and at late-night snacks this week.`; }
  }
  const change = last && w.length>1 ? Math.round((last.lb-first.lb)*10)/10 : null;
  const form = `<div class="wform">
      <label for="wIn" class="small muted">Today's weight</label>
      <div class="wrow"><input id="wIn" type="number" inputmode="decimal" step="0.1" min="70" max="400" value="${last?last.lb:""}" aria-describedby="wErr"><span class="unit">lb</span></div>
      ${weighErr?`<p id="wErr" class="err">${esc(weighErr)}</p>`:""}
      <p class="small muted">Weigh in the morning, after the bathroom, before you eat or drink.</p>
      <div class="runbtns"><button class="btn" onclick="weighOpen=false;weighErr='';home()">Cancel</button><button class="btn light" onclick="saveWeight()">Save</button></div>
    </div>`;
  const recent = w.slice(-4).reverse().map(e=>`<div><span>${esc(shortDate(e.date))}${e.date===today?" (today)":""}</span><span><b>${e.lb.toFixed(1)}</b> lb <button class="x" onclick="delWeight('${e.date}')" aria-label="Delete ${esc(shortDate(e.date))} entry">×</button></span></div>`).join("");
  return `<section class="weigh" aria-label="Weight check-ins">
    <div class="runtop"><div><p class="muted small">${due?"Check-in due":`Next check-in in ${7-daysSince} ${7-daysSince===1?"day":"days"}`}</p><h3>Weight</h3></div>${pill}</div>
    ${last?`<div class="wnow"><span class="huge-w">${last.lb.toFixed(1)}</span><span class="unit">lb</span>
      ${change!=null?`<span class="wdelta ${change<0?"down":change>0?"upc":""}">${change>0?"+":change<0?"−":""}${Math.abs(change).toFixed(1)} lb since ${esc(shortDate(first.date))}</span>`:`<span class="wdelta">Starting weight, ${esc(shortDate(first.date))}</span>`}</div>`:""}
    ${weighChart(w)}
    <p class="small">${note}</p>
    ${weighOpen?form:`<button class="btn ${due?"light":""}" onclick="weighOpen=true;home();setTimeout(()=>{const i=document.getElementById('wIn');if(i){i.focus();i.select();}},50)">${w.some(e=>e.date===today)?"Update today's weight":"Check in"}</button>`}
    ${w.length?`<div class="list wlist">${recent}</div>`:""}
    <p class="small muted">Weight swings 1 to 3 lb a day from water and salt, so judge progress by the trend over weeks, not one weigh-in.</p>
  </section>`;
}

function setPhase(p){ document.documentElement.dataset.phase = p; }
function runCard(){
  const w=runWeek(), now=new Date(), wd=(now.getDay()+6)%7, type=RUN_DAYS[wd], mon=mondayOf(now);
  const p = type ? runPlan(w,type) : null, doneToday = ranOn(isoDay(now));
  let nextTxt = "";
  if(!type){ for(let i=1;i<=7;i++){ const d=(wd+i)%7; if(RUN_DAYS[d]!=null){ nextTxt=`Next run ${WD_NAMES[d]}: ${runPlan(w+(wd+i>6?1:0),RUN_DAYS[d]).title.toLowerCase()}.`; break; } } }
  const rows = Object.keys(RUN_DAYS).map(Number).map(d=>{
    const day=new Date(mon); day.setDate(mon.getDate()+d); const key=isoDay(day), rp=runPlan(w,RUN_DAYS[d]);
    return `<div class="${d===wd?"today":""}"><span class="rd">${WD_NAMES[d]}</span><span class="rm">${ranOn(key)?'<i class="tick" aria-label="Done">✓</i>':rp.mins+"<small style=\"font-size:.6em\"> min</small>"}</span><span class="rt">${esc(rp.title==="Long easy run"?"Long run":rp.title)}</span></div>`;
  }).join("");
  return `<section class="runbox tone-sky" aria-label="Running">
    <div class="runtop"><div>
        <p class="muted small">${type?(doneToday?"Run done today":"Today's run"):"Today"}</p>
        <h2>${type?esc(p.title):"Rest your legs"}</h2></div>
      <span class="wkctl"><button onclick="shiftWeek(-1)" aria-label="Previous week" ${w<=1?"disabled":""}>‹</button><span>Week ${w}${w>6?"":"/6"}</span><button onclick="shiftWeek(1)" aria-label="Next week">›</button></span></div>
    <p class="meta">${type?`${p.mins} min. ${esc(p.summary)}.`:`${wd===6?"Rest day. A walk is fine.":"No run on the plan today."} ${nextTxt}`}</p>
    ${type&&!doneToday?`<div class="runbtns"><button class="btn" onclick="logRun('${type}')">I already ran</button><button class="btn light" onclick="startRun('${type}')">Start run</button></div>`:""}
    ${doneToday?`<div class="runbtns"><button class="btn" onclick="unlogRun()">Undo, I didn't run today</button></div><p class="muted small">You can undo until midnight. After that, today's run is locked in.</p>`:""}
    <div class="runlist">${rows}</div>
    <p class="muted small">${w>6?"Plan finished. Repeat week 6, or sign up for a 5K.":"Easy means you can still talk. Sore shins or knees? Take an extra rest day."}</p>
  </section>`;
}
/* ---------- weekly goal: forgiving, counts any session, streak is in weeks ---------- */
let goalOpen=false;
function weekGoal(){ const g=+store.get("weekGoal"); return g>=1&&g<=7 ? g : 4; }
function setGoal(d){ store.set("weekGoal", Math.min(7,Math.max(1,weekGoal()+d))); home(); }
function sessionsIn(monKey){ const m=toDate(monKey), e=new Date(m); e.setDate(m.getDate()+7); const end=isoDay(e); return getHistory().filter(x=>x.date>=monKey && x.date<end).length; }
function weekStreak(){
  const g=weekGoal(); let n=0, m=mondayOf(new Date());
  if(sessionsIn(isoDay(m))>=g) n++;          // this week counts once it's hit
  for(let i=0;i<104;i++){ m.setDate(m.getDate()-7); if(sessionsIn(isoDay(m))>=g) n++; else break; }
  return n;
}
function goalRing(done, goal){
  const C=2*Math.PI*24, f=Math.min(1,done/goal);
  return `<svg viewBox="0 0 58 58" aria-hidden="true"><circle cx="29" cy="29" r="24" fill="none" stroke="var(--surface-2)" stroke-width="7"/>
    <circle cx="29" cy="29" r="24" fill="none" stroke="var(--banana)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}" ${f===0?'opacity="0"':""}/></svg>`;
}
function home(){
  stopTimer(); setPhase("home");
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; }
  const sh=document.getElementById("sheet"); if(sh) sh.remove();
  const next = suggested(), steps = buildSteps(pick);
  const work = pick==="M" ? CIRCUIT.map(x=>({...x, sets:3, target:x.timed?"30 sec":x.target}))
    : GYM_DAYS[pick] ? DAY[pick].list.flatMap(x=>x.superset ? x.superset.map((y,i)=>({...y, sets:x.rounds, target:`${y.target}, superset with ${x.superset[1-i].name.toLowerCase()}`})) : [x])
    : steps.filter(s=>s.kind==="work");
  const today = new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  const mon = isoDay(mondayOf(new Date())), weekCount = sessionsIn(mon), goal = weekGoal(), streak = weekStreak();
  const row = s => `<div class="row"><canvas class="thumb" data-anim="${ANIM_BY_NAME[s.name]||""}" aria-hidden="true"></canvas>
     <div><b>${esc(s.name)}</b><span>${esc(dose(s))}</span></div></div>`;
  const grp = (label, list) => `<details class="grpd" ontoggle="paintThumbs()"><summary><b>${label}</b><span>${list.length} moves, ${Math.round(list.reduce((a,x)=>a+(x.secs||0),0)/60)} min</span></summary><div class="inner">${list.map(row).join("")}</div></details>`;
  const titleLines = {A:"Push<br>&amp; legs", B:"Pull<br>&amp; core", M:"Quick<br>circuit", G1:"Gym<br>legs", G2:"Gym<br>arms"}[pick];
  const kicker = pick==="M" ? "Busy-day version" : GYM_DAYS[pick] ? `At the gym, in place of Day ${pick==="G1"?"A":"B"}` : `${DAY_META[pick].label}${pick===next?", up next":""}`;
  $(`
   <header class="mast">
     <div class="wordmark"><b>Kong</b><span>Training, ${esc(today)}</span></div>
     <button class="goal" onclick="goalOpen=!goalOpen;home()" aria-expanded="${goalOpen}" aria-label="${weekCount} of ${goal} sessions this week${streak?`, ${streak} week streak`:""}. Change weekly goal">
       <span class="gtxt"><b>${weekCount}<small>/${goal}</small></b><span>${weekCount>=goal?"Goal hit":"this week"}</span>${streak?`<span class="streak">${streak}-week streak</span>`:""}</span>${goalRing(weekCount,goal)}</button>
   </header>
   ${weekStrip()}
   ${goalOpen?`<div class="goalset"><div><b>Weekly goal</b><p class="small muted">Workouts and runs both count.</p></div>
     <div class="stepper"><button onclick="setGoal(-1)" aria-label="Lower goal">−</button><output aria-live="polite">${goal}</output><button onclick="setGoal(1)" aria-label="Raise goal">+</button></div></div>`:""}
   <div class="chips" role="group" aria-label="Choose a workout">${["A","B","M"].map(k=>`<button aria-pressed="${pick===k}" onclick="pick='${k}';home()">${k==="M"?"Quick":"Day "+k}</button>`).join("")}<span class="div" aria-hidden="true"></span>${["G1","G2"].map(k=>`<button aria-pressed="${pick===k}" onclick="pick='${k}';home()">${k==="G1"?"Gym legs":"Gym arms"}</button>`).join("")}</div>
   <section class="poster tone-banana" aria-label="Today's workout">
     <div class="stage"><canvas id="demo" data-anim="${ANIM_BY_NAME[work[0].name]}" aria-hidden="true"></canvas></div>
     <div class="poster-txt"><p class="kicker">${kicker}</p><h2>${titleLines}</h2>
       <p class="meta">${DAY_META[pick].mins} min, ${pick==="M"?"3 rounds of 4 moves":work.length+" exercises"}, ${EQUIP[pick].toLowerCase()}</p></div>
   </section>
   ${runCard()}
   ${weighCard()}
   <div class="section"><div class="sechead"><h3>In this session</h3><span class="muted small">About ${DAY_META[pick].mins} min</span></div>
     ${grp("Warm-up", steps.filter(s=>s.kind==="warm"))}
     <p class="grp">${pick==="M"?"Circuit, 3 rounds":"Workout"}</p>${work.map(row).join("")}

   <div class="dock"><div class="dock-in"><button class="btn primary" onclick="start()">Start ${pick==="M"?"quick circuit":DAY_META[pick].label}</button></div></div>`);
  paintThumbs();
  const chipRow=document.querySelector(".chips"), on=chipRow&&chipRow.querySelector('[aria-pressed="true"]');   // keep the chosen chip in view
  if(on && on.offsetLeft+on.offsetWidth > chipRow.clientWidth) chipRow.scrollLeft = on.offsetLeft + on.offsetWidth - chipRow.clientWidth + 16;

/* ---------- session ---------- */
function start(){
  S = {day:pick, prev:{}, disp:{}, lb:null, steps:buildSteps(pick), i:0, set:1, phase:"work", left:0, total:0, running:false, logs:{}, t:null, reps:0, t0:Date.now()};
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  if(navigator.wakeLock){ navigator.wakeLock.request("screen").then(w=>wakeLock=w).catch(()=>{}); }
  scrollTo(0,0); enter();
}
function cur(){return S.steps[S.i];}
/* Gym weights: each exercise keeps its most recent session, saved set by set. */
const gymKey = s => "gym:"+(s.logKey||s.name);
function prevRec(s){ S.prev = S.prev||{}; const k=gymKey(s); if(!(k in S.prev)) S.prev[k]=store.get(k); return S.prev[k]; }
function prevSet(s){ const pv=prevRec(s); if(!pv||!Array.isArray(pv.sets)) return null; return pv.sets[s.logIdx ?? S.set-1] || pv.sets.filter(Boolean).slice(-1)[0] || null; }
function defaultLb(s){ if(!s.weighted) return null; const x=prevSet(s); return x && x.lb!=null ? x.lb : null; }
function saveGymSet(s, idx, lb, reps){
  const k=gymKey(s), today=isoDay(new Date()); let r=store.get(k);
  if(!r || r.date!==today || !Array.isArray(r.sets)) r={date:today, sets:[]};
  r.sets[idx]={lb, reps}; store.set(k, r);
}
function bumpLb(d){ const i=document.getElementById("lbIn"); const v=parseFloat(i&&i.value); S.lb=Math.max(0,(isNaN(v)?0:v)+d); if(i) i.value=S.lb; }
const fmtSet = x => x ? (x.lb!=null ? `${x.lb}×${x.reps}` : `${x.reps} reps`) : "";
function weightRow(s){
  const pv=prevRec(s), mine=prevSet(s), top=+((String(s.target).match(/(\d+)\D*$/)||[])[1]||0);
  const sets=pv&&Array.isArray(pv.sets)?pv.sets.filter(Boolean):[];
  const allTop = top && sets.length && sets.every(x=>+x.reps>=top);
  let last = "First time: pick a weight where the last 2 reps are hard.";
  if(sets.length){
    const same = sets.every(x=>x.lb===sets[0].lb);
    last = `Last time, ${esc(shortDate(pv.date))}: ` + (same && sets[0].lb!=null ? `${sets[0].lb} lb for ${sets.map(x=>x.reps).join(", ")} reps` : sets.map(fmtSet).join(", "));
  }
  const tip = allTop ? (s.assist ? "You hit the top of the range every set. Lower the help by 5 lb today." : "You hit the top of the range every set. Go up 5 lb today.") : "";
  return `<div class="wt">
      <div class="wthead"><span class="unit">${s.assist?"Assistance":"Weight"}${s.perDb?", each dumbbell":""}</span>${mine&&mine.lb!=null?`<span class="lastchip">Last time this set: <b>${mine.lb} lb × ${mine.reps}</b></span>`:""}</div>
      <div class="wtrow"><div class="stepper"><button onclick="bumpLb(-5)" aria-label="5 pounds less">−</button>
        <input id="lbIn" type="number" inputmode="decimal" step="2.5" min="0" value="${S.lb!=null?S.lb:""}" placeholder="–" aria-label="Weight in pounds" onchange="S.lb=parseFloat(this.value)">
        <button onclick="bumpLb(5)" aria-label="5 pounds more">+</button></div><span class="unit">lb</span></div>
      <p class="small muted">${last}</p>${tip?`<p class="small tip">${tip}</p>`:""}
    </div>`;
}
function defaultReps(s){
  if(s.weighted){ const x=prevSet(s); if(x && x.reps!=null && !isNaN(+x.reps)) return +x.reps; const m=String(s.target||"").match(/\d+/); return m?+m[0]:10; }
  const prev = store.get("log:"+(s.logKey||s.name)), idx = s.logIdx ?? S.set-1;
  if(prev && prev[idx]) return +prev[idx];
  if(prev && prev[S.set-1]) return +prev[S.set-1];
  if(prev && prev.filter(Boolean).length) return +prev.filter(Boolean).slice(-1)[0];
  const m = String(s.target||"").match(/\d+/); return m ? +m[0] : 10;
}
function enter(){
  const s = cur(); S.set = 1; S.phase = "work"; stopTimer();
  S.left = S.total = s.secs || s.timed || 0; S.reps = defaultReps(s); S.lb = defaultLb(s);
  if(s.secs) runTimer();
  draw(); scrollTo(0,0);
}
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
function beep(f, len, vol){
  if(f!==undefined){ if(!actx) return; try{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.value=vol||.08;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+(len||.12));}catch(e){} return; }
  beepEnd();
}
function beepEnd(){
  if(!actx) return;
  try{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.15;
    o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.25);}catch(e){}
}
const RC = 2*Math.PI*66;
function tick(){
  const c=document.getElementById("clock"); if(c) c.textContent = fmt(S.left);
  const r=document.getElementById("ring"); if(r) r.style.strokeDashoffset = RC*(1-S.left/Math.max(1,S.total));
}
function runTimer(){
  stopTimer(); S.running = true;
  S.t = setInterval(()=>{ S.left--;
    if(S.left<=0){ stopTimer(); beep(); buzz([90,60,90]); timerDone(); return; }
    if(S.left<=3 && S.total>=10) beep(660,.08,.06);   // 3-2-1 countdown
    tick(); },1000);
}
function stopTimer(){ if(S.t) clearInterval(S.t); S.t=null; S.running=false; }
function toggle(){ S.running ? stopTimer() : runTimer(); draw(); }
function timerDone(){
  const s = cur();
  if(s.secs){ next(); return; }
  if(S.phase==="rest"){ S.set++; S.phase="work"; S.left = S.total = s.timed||0; S.reps = defaultReps(s); S.lb = defaultLb(s); draw(); return; }
  if(s.timed){ finishSet(); }
}
function bump(d){ S.reps = Math.max(0, S.reps + d); const o=document.getElementById("repsOut"); if(o) o.textContent = S.reps; }
function finishSet(){
  const s = cur(); buzz(25);
  if(s.weighted){
    const v=parseFloat((document.getElementById("lbIn")||{}).value); S.lb = isNaN(v) ? null : v;
    const idx = s.logIdx ?? S.set-1; saveGymSet(s, idx, S.lb, S.reps);
    const key = s.logKey||s.name; (S.disp[key] = S.disp[key]||[])[idx] = S.lb!=null ? `${S.lb}×${S.reps}` : `${S.reps}`;
  }
  if(!s.timed && !s.noLog){ const key = s.logKey||s.name; (S.logs[key] = S.logs[key]||[])[s.logIdx ?? S.set-1] = String(S.reps); }
  if(S.set >= s.sets){ next(); return; }
  S.phase = "rest"; S.left = S.total = s.rest || 60; runTimer(); draw();
}
function next(){ if(S.i < S.steps.length-1){ S.i++; enter(); } else finish(); }
function back(){ if(S.i>0){ S.i--; enter(); } }
function adjRest(d){ S.left=Math.max(1,S.left+d); S.total=Math.max(S.total,S.left); tick(); const c=document.getElementById("clock"); if(c) c.className="big"+(S.left>=60?" long":""); }
function skipRest(){ stopTimer(); S.set++; S.phase="work"; S.left = S.total = cur().timed||0; S.reps = defaultReps(cur()); S.lb = defaultLb(cur()); draw(); }

function dots(done, n){ if(!n||n>8) return ""; return `<div class="dots" aria-hidden="true">${Array.from({length:n},(_,k)=>`<i class="${k<done?"on":""}"></i>`).join("")}</div>`; }
function lastReps(s){ const pv=store.get("log:"+(s.logKey||s.name)); if(!Array.isArray(pv)) return null; const v=pv[s.logIdx ?? S.set-1]; return v!=null&&v!==""&&!isNaN(+v) ? +v : null; }
function ring(label, accent){
  const off = RC*(1-S.left/Math.max(1,S.total));
  return `<div class="ringwrap"><svg viewBox="0 0 150 150" aria-hidden="true">
     <circle cx="75" cy="75" r="66" fill="none" stroke="var(--surface-2)" stroke-width="9"/>
     <circle id="ring" cx="75" cy="75" r="66" fill="none" stroke="${accent?"var(--accent)":"var(--ink)"}" stroke-width="9" stroke-linecap="round"
       stroke-dasharray="${RC}" style="stroke-dashoffset:${off};transition:stroke-dashoffset 1s linear"/></svg>
     <div class="num"><span id="clock" class="big${S.total>=60?" long":""}">${fmt(S.left)}</span><span class="unit">${label}</span></div></div>`;
}

function draw(){
  const s = cur(), nxt = S.steps[S.i+1];
  setPhase(s.kind==="warm"?"warm":s.kind==="cool"?"cool":s.kind==="run"?"run":"work");
  const unit = ((s.round || s.noLog) && !s.superset) ? "round" : "set", curN = s.round||S.set, totN = s.rounds||s.sets;
  const kinds = {warm:"Warm-up", work:"Workout", cool:"Cool-down", run:"Run"};
  const inKind = S.steps.filter(x=>x.kind===s.kind), pos = inKind.indexOf(s)+1;
  let metric = "", dock = "";
  if(s.secs){
    metric = `<div class="metric">${ring(S.total>=60?"left":"seconds", s.kind!=="cool")}
       <div class="side"><p class="muted small">${s.kind==="cool"?"Hold the stretch and breathe slowly.":s.kind==="run"?esc(S.runTitle)+", "+S.runMins+" min total. Your phone beeps at each change.":"Easy pace. Just get warm."}</p></div></div>`;
    dock = `<div class="dock-row"><button class="btn" onclick="toggle()">${S.running?"Pause":"Resume"}</button>
       <button class="btn primary" onclick="next()">Next</button></div>`;
  } else if(S.phase==="rest"){
    metric = `<div class="metric">${ring("rest", false)}
       <div class="side"><span class="unit">Up next</span><span class="huge">${S.set+1}<span class="unit"> / ${s.sets}</span></span><span class="unit">${unit}</span>
         <div class="radj"><button onclick="adjRest(-15)" aria-label="15 seconds less rest">−15s</button><button onclick="adjRest(15)" aria-label="15 seconds more rest">+15s</button></div></div></div>`;
    dock = `<div class="dock-row"><button class="btn" onclick="toggle()">${S.running?"Pause":"Resume"}</button>
       <button class="btn primary" onclick="skipRest()">Skip rest</button></div>`;
  } else if(s.timed){
    metric = `<div class="metric">${ring("seconds", true)}
       <div class="side"><span class="unit">${unit[0].toUpperCase()+unit.slice(1)}</span><span class="huge">${curN}<span class="unit"> / ${totN}</span></span></div></div>`;
    dock = S.running
      ? `<div class="dock-row"><button class="btn" onclick="stopTimer();finishSet()">Done early</button><button class="btn primary" onclick="toggle()">Pause</button></div>`
      : `<button class="btn primary" onclick="toggle()">Start ${S.total} sec</button>`;
  } else {
    metric = `<div class="metric">
       <div class="setcol"><span class="unit">${unit[0].toUpperCase()+unit.slice(1)}</span><span class="huge">${curN}<span class="unit"> / ${totN}</span></span>${dots(curN-1,totN)}</div>
       ${s.noLog ? "" : `<div><div class="stepper"><button onclick="bump(-1)" aria-label="One fewer rep">−</button>
          <output id="repsOut" aria-live="polite">${S.reps}</output><button onclick="bump(1)" aria-label="One more rep">+</button></div>
          ${!s.weighted && lastReps(s)!=null ? `<p class="lastline">Last time: <b>${lastReps(s)}</b> reps</p>` : `<p class="steplbl">Reps</p>`}</div>`}</div>`;
    if(s.weighted) metric += weightRow(s);
    dock = `<button class="btn primary" onclick="finishSet()">${s.noLog?"Round done":"Log set"}</button>`;
  }
  $(`
   <div class="bars" aria-hidden="true">${S.steps.map((x,k)=>`<i class="${k<S.i?"done":k===S.i?"now":""}"><b${k===S.i?` style="width:${s.sets?((S.set-1+(S.phase==="rest"?1:0))/s.sets)*100:0}%"`:""}></b></i>`).join("")}</div>
   <div class="playtop">
     <button class="close" onclick="askEnd()" aria-label="End workout">
       <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
     <span class="phase">${kinds[s.kind]}, ${pos} of ${inKind.length}</span>
     <span style="width:40px"></span>
   </div>
   <div class="stage player-stage"><canvas id="demo" data-anim="${ANIM_BY_NAME[s.name]||""}" role="img" aria-label="Animated demo of ${esc(s.name)}"></canvas>
     ${s.kind==="run"?"":`<a href="${yt(s.q||s.name)}" target="_blank" rel="noopener">Watch video</a>`}</div>
   <div class="title"><h2${s.name.length>18?' style="font-size:2.35rem"':''}>${esc(s.name)}</h2>${s.target?`<p class="target">${esc(s.target)}</p>`:""}</div>
   ${metric}
   <p class="cue">${esc(s.cue)}</p>
   <div class="dock"><div class="dock-in">
     ${dock}
     <div class="minor"><button onclick="back()" ${S.i===0?"disabled":""}>Previous</button>
       <span>${nxt?`Next: <b>${esc(nxt.name)}</b>`:"Last one"}</span>
       <button onclick="next()">Skip</button></div>
   </div></div>`);
}

function goalLine(){
  const n=sessionsIn(isoDay(mondayOf(new Date()))), g=weekGoal(), st=weekStreak(), C=2*Math.PI*18, f=Math.min(1,n/g);
  const msg = n>=g ? (n===g ? `Weekly goal hit${st>1?`. ${st}-week streak`:""}.` : `${n} sessions this week, past your goal of ${g}.`) : `${g-n} more this week to hit your goal${st?` and keep your ${st}-week streak`:""}.`;
  return `<div class="goalline"><svg viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="18" fill="none" stroke="var(--surface-2)" stroke-width="6"/><circle cx="23" cy="23" r="18" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}"/></svg>
    <div><b>${n} of ${g} this week</b><p class="small muted">${msg}</p></div></div>`;
}
function askEnd(){
  const logged = S.day==="R" ? S.i>0 : Object.keys(S.logs||{}).length>0;
  if(!logged && S.i<2){ home(); return; }
  const wasRunning=S.running; stopTimer();
  const el=document.createElement("div"); el.className="sheet-bg"; el.id="sheet";
  const close=()=>{ el.remove(); if(wasRunning) runTimer(); draw(); };
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"><h3 id="shT">End workout?</h3>
    <p>${logged?"Your logged sets are saved and it counts toward your week.":"Nothing logged yet, so this won't count toward your week."}</p>
    <button class="btn primary" data-a="keep">Keep going</button>
    ${logged?`<button class="btn" data-a="save">Finish and save</button>`:""}
    <button class="btn danger" data-a="drop">${logged?"Discard workout":"End without saving"}</button></div>`;
  el.addEventListener("click",e=>{ const a=e.target.dataset&&e.target.dataset.a; if(e.target===el||a==="keep") close(); else if(a==="save"){ el.remove(); finish(); } else if(a==="drop"){ el.remove(); home(); } });
  el.addEventListener("keydown",e=>{ if(e.key==="Escape") close(); });
  document.body.appendChild(el); el.querySelector("[data-a=keep]").focus();
}
function finish(){
  stopTimer(); setPhase("done");
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; }
  if(S.day==="R"){
    const mins=Math.max(1,Math.round((Date.now()-S.t0)/60000)), hist=getHistory();
    hist.push({date:isoDay(new Date()), day:"R", title:S.runTitle, mins:S.runMins}); store.set("history", hist.slice(-200));
    const dates=new Set(store.get("doneDates")||[]); dates.add(isoDay(new Date())); store.set("doneDates",[...dates].slice(-60));
    $(`<div class="done-hero"><p class="muted small">Run complete</p><h1>${esc(S.runTitle)} done.</h1>
        <p class="muted">Stretch your calves and hamstrings, and drink some water.</p></div>
      ${weekStrip()}
      ${goalLine()}
      <div class="stats"><div class="stat"><b>${S.runMins}</b><span>min planned</span></div>
        <div class="stat"><b>${mins}</b><span>min on timer</span></div>
        <div class="stat"><b>${runWeek()}</b><span>plan week</span></div></div>
      <div class="dock"><div class="dock-in"><button class="btn primary" onclick="home()">Done</button></div></div>`);
    return;
  }
  Object.entries(S.logs).forEach(([k,v])=>store.set("log:"+k, v));
  const date = new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  const lastMap = {A:"A", B:"B", G1:"A", G2:"B"}; if(lastMap[S.day]) store.set("lastDay", lastMap[S.day]);
  store.set("lastDone", {day: S.day==="M"?"Minimum":S.day, date});
  const dates = new Set(store.get("doneDates")||[]); dates.add(isoDay(new Date())); store.set("doneDates", [...dates].slice(-60));
  const mins = Math.max(1, Math.round((Date.now()-S.t0)/60000));
  const totalReps = Object.values(S.logs).flat().filter(Boolean).reduce((a,b)=>a+ +b,0);
  const hist = getHistory(); hist.push({date: isoDay(new Date()), day: S.day, mins, reps: totalReps}); store.set("history", hist.slice(-200));
  /* personal bests: heaviest weight for gym lifts, most reps in one set for bodyweight */
  const bests = store.get("bests")||{}, newPB = new Set();
  Object.entries(S.logs).forEach(([k,v])=>{
    const reps=Math.max(0,...v.filter(Boolean).map(Number));
    const lbs=((S.disp&&S.disp[k])||[]).filter(x=>String(x).includes("×")).map(x=>parseFloat(x)).filter(x=>!isNaN(x));
    const lb=lbs.length?Math.max(...lbs):null;
    const was=bests[k];
    if(lb!=null){ if(was&&was.lb!=null&&lb>was.lb) newPB.add(k); if(!was||was.lb==null||lb>was.lb) bests[k]={lb}; }
    else if(reps>0){ if(was&&was.reps!=null&&reps>was.reps) newPB.add(k); if(!was||was.reps==null||reps>was.reps) bests[k]={reps}; }
  });
  store.set("bests", bests);
  const rows = Object.entries(S.logs).map(([k,v])=>`<div><span>${esc(k)}${newPB.has(k)?'<i class="pb">New best</i>':""}</span><span>${((S.disp&&S.disp[k])||v).filter(Boolean).map(x=>esc(String(x).replace("×"," × "))).join(", ")}</span></div>`).join("");
  const nEx = Object.keys(S.logs).length || new Set(S.steps.filter(x=>x.kind==="work"&&!x.isRest).map(x=>x.logKey||x.name)).size;
  pick = suggested();
  $(`
   <div class="done-hero"><p class="muted small">Workout complete</p><h1>${newPB.size?"New best.":S.day==="M"?"Habit kept. Nice.":"Great session."}</h1>
     <p class="muted">${newPB.size ? `${newPB.size} new personal best${newPB.size>1?"s":""}. ` : ""}${S.day==="M" ? "Short days still count toward your week." : `Next up is ${esc(DAY[pick].title.toLowerCase())}.`}</p></div>
   ${weekStrip()}
   ${goalLine()}
   <div class="stats">
     <div class="stat"><b>${mins}</b><span>${mins===1?"minute":"minutes"}</span></div>
     <div class="stat"><b>${nEx}</b><span>${nEx===1?"exercise":"exercises"}</span></div>
     <div class="stat"><b>${totalReps}</b><span>reps logged</span></div>
   </div>
   ${rows? `<div class="section"><h3>Your sets</h3><div class="list">${rows}</div><p class="muted small" style="padding-top:8px">Next time, each set starts at these numbers. Try to beat one.</p></div>`:""}
   <div class="dock"><div class="dock-in"><button class="btn primary" onclick="home()">Done</button></div></div>`);
}

home();
/* Offline: cache the app's own files after the first visit. Skipped when opened as a local file. */
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
